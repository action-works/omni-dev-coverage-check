name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint the scripts
        run: shellcheck -x scripts/*.sh tests/*.sh

      - name: Test combine-shards.sh
        run: bash tests/combine-shards.test.sh

      - name: Test omni-dev-asset.sh
        run: bash tests/omni-dev-asset.test.sh

      - name: Test the platform step of action.yml
        run: bash tests/platform-step.test.sh

      - name: Test the guard step of action.yml
        run: bash tests/guard-step.test.sh

      - name: Test the resolve-version step of action.yml
        run: bash tests/resolve-version-step.test.sh

      - name: Test find-baseline.sh
        run: bash tests/find-baseline.test.sh

      - name: Test the baseline steps of action.yml
        run: bash tests/baseline-steps.test.sh

      - name: Test expected-baseline.sh
        run: bash tests/expected-baseline.test.sh

      - name: Test baseline-lib.sh
        run: bash tests/baseline-lib.test.sh

      - name: Test job-errors.sh
        run: bash tests/job-errors.test.sh

      - name: Test assert-lib.sh
        run: bash tests/assert-lib.test.sh

      - name: Test prepare-shard-crate.sh
        run: bash tests/prepare-shard-crate.test.sh

      - name: Test check-deprecated-flags.sh
        run: bash tests/check-deprecated-flags.test.sh

      - name: Test assert-omni-dev-version.sh
        run: bash tests/assert-omni-dev-version.test.sh

      - name: Test llvm-tool-shim.sh
        run: bash tests/llvm-tool-shim.test.sh

      - name: Test test-lib.sh
        run: bash tests/test-lib.test.sh

      - name: Test step-lib.sh
        run: bash tests/step-lib.test.sh

      # Not a lint of the scripts, but it needs no setup and belongs on every pull
      # request: it fails when action.yml (or a script it ships) passes omni-dev a
      # flag omni-dev has deprecated, before a major release removes it.
      - name: Check the action passes no deprecated omni-dev flag
        run: bash tests/check-deprecated-flags.sh
