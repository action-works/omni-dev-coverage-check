name: Integration

# Runs the action itself (`uses: ./`) on a real runner on every change: in thin
# mode against fixture lcov files (the thin-mode line gate and `shard-reports`,
# `ignore-filename-regex`, the `--output` floor a pull request needs, and the
# `version` input's empty, `v` and `V` spellings), and in fat mode against a
# fixture crate (the instrumented test run, the three report outputs and the one
# profile merge they share, the fat-mode line gate,
# `setup-commands`/`extra-test-commands`, `llvm-cov-ignore-filename-regex`). Each
# scenario's outcome is asserted
# at the end of its job; the scenarios are `continue-on-error` so one regression
# does not hide the rest. What the six scenarios that exist for their message
# said is asserted by `failure-messages`, which reads the finished jobs' logs through
# the API. On a pull request it also asserts that none of the jobs that ran the
# pull-request steps logged an omni-dev deprecation warning, and a control job
# that logs one on purpose shows that reading can find it. To show that the pre-built
# binary is chosen by architecture, the ARM64 legs of `thin-mode` run on an ARM64 Linux
# runner against a release that has the ARM64 asset, and `arm64-release-without-asset`
# against one that does not. One job resolves `version: latest` with a token the API
# refuses, so that the fallback to the releases/latest redirect has to answer, and
# compares it with the API's answer. One pins `version: v0.45.0`, to show that the
# whole install takes a release tag as written.
#
# Rules that keep these tests honest:
#   - One omni-dev version per job. `actions/cache` saves in a post step, after
#     every scenario has run, and saves whatever is at ~/.cargo/bin/omni-dev
#     then; a second version installed over it poisons the first version's key.
#     A job that asserts its scenarios' outcomes ends on
#     tests/assert-omni-dev-version.sh, which fails unless the binary on PATH is
#     exactly the version the job pinned. `arm64-release-without-asset` installs
#     nothing and `deprecation-control` has one install and asserts no outcome, so
#     neither calls it, and `old-glibc`'s failing leg installs a binary that cannot
#     start, so only its control does.
#   - A job that exists to run the install does not run on a cached binary. A hit on
#     `actions/cache` restores ~/.cargo/bin/omni-dev and skips the platform and download
#     steps, and the key holds the version, not the action's code, so such a job would
#     pass on a binary an earlier run installed, whatever a change did to the install.
#     `thin-mode` (every leg) puts a prefix in front of the key (tests/install-cache.sh):
#     a hash of action.yml and scripts/*.sh on a pull request and a push, so that a change
#     to the install code installs and unchanged code reuses the entry, and the run and the
#     attempt on the weekly run and a manual one, so those install every time. Both carry
#     the leg: a pinned leg and `latest` can resolve to the same key, and the one that
#     finishes first would save the entry the other restores, which then installs nothing. Its
#     checking step reads the action's `omni-dev-cache-hit` output, logs which it was,
#     and fails when a run that cannot have an entry hit one. `version-pin` forces the
#     install on every event with a key of its own, and fails on a hit whatever the event
#     (`check-fresh`, #84). The other jobs exist for something
#     else, and the cache is useful to them.
#   - Every scenario expected to fail has a control that differs in exactly one
#     input and must succeed, plus a file check showing where the action stopped.
#     `outcome == failure` alone also holds when the install breaks.
#   - Fat-mode scenarios share the workspace, and the action writes some outputs
#     to fixed names, so each scenario's outputs are moved to out/<id>/ before the
#     next one runs. Otherwise a later scenario's checks could pass on an earlier
#     one's leftovers.
#   - Every scenario passes `baseline-ancestor-depth: 0`. None is about the baseline, and
#     this workflow publishes none, so with the walk on each lookup on a pull request would
#     try the merge-base and ten ancestors and find nothing: up to about 230 requests per
#     pull-request run, against the 1,000 an hour a repository's token has. The walk and the baseline lookup
#     are tested in pr-paths.yml and e2e-sharded.yml, and scripts/find-baseline.sh by
#     tests/find-baseline.test.sh.
#   - A message is read from the job's `##[error]` lines and nowhere else in the
#     log. The log also echoes every step's script, which holds the same message
#     text whether or not the step ran it, so a grep of the whole log would pass
#     for the wrong reason. tests/job-errors.sh does the reading.
#   - A deprecation warning is read from the lines a program printed (`warning:`
#     right after the timestamp), for the same reason: the echo of a script can hold
#     the words. tests/job-deprecations.sh does the reading. It can speak only for the
#     steps a job ran, and a skipped step logs nothing, so each job it reads also
#     shows, with a file check, that the pull-request steps ran: an empty read of a
#     job that skipped them would prove nothing. The control job is the other half:
#     a read that finds nothing anywhere would pass every one of those checks.
#
# The merge queue on `main` (#76) requires one check from this workflow, `ci-gate`, which
# is the last job: it needs every other job here and is red unless each succeeded. The
# jobs are not required one by one because a matrix change renames them, and
# `failure-messages` is skipped when a scenario fails, which GitHub counts as passing.
# A new job goes in `ci-gate`'s `needs`; tests/merge-queue.test.sh fails until it does.
# A `merge_group` run takes every branch a `push` takes (nothing here tests for it), so
# the queue's commit gets the whole suite and nothing is published or commented.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The event a merge queue runs the required checks on. Without it `ci-gate` never
  # reports for the queue's commit and the pull request waits forever. It has no
  # `paths:` filter, which this workflow does not use either.
  merge_group:
  schedule:
    - cron: '17 6 * * 1' # weekly: notice a bad omni-dev release without waiting for a PR
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The newest release WITHOUT `coverage diff --fail-under-lines`, which the
  # action's guard step detects. It stays put when the floor in the thin-mode
  # matrix is raised. Shared by the job that runs it and the job that checks what
  # the guard said about it.
  OLD_OMNI_DEV: '0.44.0'

jobs:
  # The thin-mode scenarios on x86_64 and on ARM64 Linux. The ARM64 legs are the install
  # that succeeds on ARM64 (#20): a release that carries `omni-dev-linux-arm64.tar.gz`,
  # downloaded, extracted and run on a real ARM64 runner. `arm64-release-without-asset`
  # below is the other half: the same runner on a release without the asset, which must
  # fail (its inputs differ from these in more than the version: it turns the line gate
  # off, which 0.44.0 lacks). They are legs of this job so that a scenario added here
  # reaches ARM64 too. The x86_64 legs keep the names they always had; the ARM64 ones add
  # `, ARM64`, which is what `failure-messages` looks them up by.
  #
  # Every leg runs the install when the install code changes, and on the weekly and manual
  # runs, instead of trusting `actions/cache` (#66): a hit restores ~/.cargo/bin/omni-dev and
  # skips "Download pre-built binary", and the default key holds the version, not the
  # action's code. So the asset's name, the archive layout and the binary are held to a
  # real release when it matters, and not only on the first run for a version. The first
  # step chooses the `cache-prefix` (see tests/install-cache.sh) and the last reads
  # `omni-dev-cache-hit` to say which happened. On a pull request and a push a hit is the
  # unchanged-code case and is logged; on the weekly and manual runs it fails.
  #
  # What that costs: the four scenarios of a leg each miss on the first run for a prefix,
  # because the entry is saved in the post step, so omni-dev is installed four times and
  # three of the four saves log `Unable to reserve cache`. The weekly and manual runs each
  # write an entry per leg that nothing restores (9-18 MB, evicted when unused).
  thin-mode:
    name: Thin mode (omni-dev ${{ matrix.omni-dev }}${{ matrix.arch == 'ARM64' && ', ARM64' || '' }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 0.45.0 is the first release with `coverage diff --fail-under-lines`: the
          # floor the README documents. `latest` catches a bad future release.
          - { omni-dev: '0.45.0', runner: ubuntu-latest, arch: X64 }
          - { omni-dev: 'latest', runner: ubuntu-latest, arch: X64 }
          # 0.46.0 is the first release that publishes omni-dev-linux-arm64.tar.gz
          # (rust-works/omni-dev#2148), so it is the floor for the ARM64 pre-built
          # install and stays put. `ubuntu-24.04-arm`: omni-dev's Linux binaries need
          # the glibc of Ubuntu 24.04 (2.39), which an older ARM runner image lacks.
          - { omni-dev: '0.46.0', runner: ubuntu-24.04-arm, arch: ARM64 }
          - { omni-dev: 'latest', runner: ubuntu-24.04-arm, arch: ARM64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The key of the omni-dev cache is the version, not the action's code, so this job
      # chooses a prefix that makes it install when the code changes (tests/install-cache.sh
      # says how, by event). The script is called as an assignment: inside an `echo` its
      # failure would be lost under `bash -e`. `hashFiles` is an expression, so the hash
      # arrives through `env`, with the leg: a pinned leg and `latest` can resolve to the
      # same key (ARM64 0.46.0 and latest do), and the one that finishes first would save
      # the entry the other restores, so the other would not run the install.
      - name: Choose the omni-dev cache prefix
        id: install-cache
        env:
          INSTALL_CODE_HASH: ${{ hashFiles('action.yml', 'scripts/*.sh') }}
          INSTALL_CACHE_LEG: ${{ matrix.omni-dev }}
        run: |
          prefix="$(bash tests/install-cache.sh prefix)"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "omni-dev cache prefix: $prefix"

      # Real llvm-cov shape: no newline after the final end_of_record. Each shard
      # alone covers 2 of 4 lines (50%); their union covers 3 of 4 (75%), so a gate
      # of 70 passes only if the shards were merged.
      - name: Write fixtures
        run: |
          mkdir shards out
          printf 'SF:%s/README.md\nDA:1,1\nDA:2,0\nDA:3,1\nDA:4,0\nend_of_record' "$GITHUB_WORKSPACE" > shards/shard-1.lcov
          printf 'SF:%s/README.md\nDA:1,0\nDA:2,1\nDA:3,1\nDA:4,0\nend_of_record' "$GITHUB_WORKSPACE" > shards/shard-2.lcov
          printf 'SF:%s/README.md\nDA:1,1\nDA:2,1\nDA:3,1\nDA:4,1\nend_of_record' "$GITHUB_WORKSPACE" > single.lcov

      - name: '1. Sharded, gate below the 75% union'
        id: s1
        uses: ./
        continue-on-error: true
        with:
          version: ${{ matrix.omni-dev }}
          cache-prefix: ${{ steps.install-cache.outputs.prefix }}
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/s1.lcov
          fail-under-lines: 70
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: integration.yml
          baseline-ancestor-depth: 0

      - name: '2. Sharded, gate above the 75% union'
        id: s2
        uses: ./
        continue-on-error: true
        with:
          version: ${{ matrix.omni-dev }}
          cache-prefix: ${{ steps.install-cache.outputs.prefix }}
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/s2.lcov
          fail-under-lines: 90
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: integration.yml
          baseline-ancestor-depth: 0

      - name: '3. Single report with the gate'
        id: s3
        uses: ./
        continue-on-error: true
        with:
          version: ${{ matrix.omni-dev }}
          cache-prefix: ${{ steps.install-cache.outputs.prefix }}
          run-coverage: false
          report: single.lcov
          fail-under-lines: 90
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: integration.yml
          baseline-ancestor-depth: 0

      - name: '4. A shard pattern that matches nothing'
        id: s4
        uses: ./
        continue-on-error: true
        with:
          version: ${{ matrix.omni-dev }}
          cache-prefix: ${{ steps.install-cache.outputs.prefix }}
          run-coverage: false
          shard-reports: shards/missing-*.lcov
          report: out/s4.lcov
          fail-under-lines: 70
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: integration.yml
          baseline-ancestor-depth: 0

      - name: Assert every outcome
        env:
          S1: ${{ steps.s1.outcome }}
          S2: ${{ steps.s2.outcome }}
          S3: ${{ steps.s3.outcome }}
          S4: ${{ steps.s4.outcome }}
          VERSION: ${{ steps.s1.outputs.version }}
          CACHE_HIT: ${{ steps.s1.outputs.omni-dev-cache-hit }}
          ARCH: ${{ runner.arch }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          status=0
          check() { # <label> <expected> <actual>
            if [ "$2" = "$3" ]; then
              echo "ok   - $1"
            else
              echo "::error::$1: expected $2, got $3"
              status=1
            fi
          }

          # A leg is about the architecture it names only if it ran on it: an ARM64 leg
          # that landed on an x86_64 runner would show nothing about the ARM64 asset.
          case "$EXPECTED_ARCH" in
            X64) machine=x86_64 ;;
            ARM64) machine=aarch64 ;;
            *)
              echo "::error::matrix.arch is '$EXPECTED_ARCH', which this step does not know: expected X64 or ARM64"
              exit 1
              ;;
          esac
          if [ "$ARCH" != "$EXPECTED_ARCH" ] || [ "$(uname -m)" != "$machine" ]; then
            echo "::error::this leg is for $EXPECTED_ARCH but ran on runner.arch $ARCH, uname -m $(uname -m)"
            status=1
          fi

          # The install ran, or the log says it did not and why (tests/install-cache.sh). s1
          # is the first scenario: it sees the cache as the job found it, since the entry
          # is saved in the post step, and a scenario that failed exposes no outputs.
          bash tests/install-cache.sh check "$CACHE_HIT" || status=1

          check "1. sharded, gate below the union" success "$S1"
          check "2. sharded, gate above the union" failure "$S2"
          check "3. single report with the gate" success "$S3"
          check "4. shard pattern matches nothing" failure "$S4"

          # Where the action stopped. 2 must fail at the gate, after the shards
          # were combined; 4 must fail before any report is written.
          if [ ! -s out/s2.lcov ]; then
            echo "::error::2 failed before the shards were combined, not at the gate"
            status=1
          fi
          if [ -e out/s4.lcov ]; then
            echo "::error::4 wrote a report although its pattern matches no shard"
            status=1
          fi

          # On a pull request 1 to 3 render the diff twice, for the comment and for
          # the percentages, and the failure-messages job reads this job's log for
          # a deprecation warning from either. The files show the steps ran: a
          # skipped step logs nothing, so a log without a warning proves nothing
          # about a step that did not run. The three scenarios share a workspace and
          # the files keep their names, so they show that at least one of them got
          # there; the diffs are called with the same flags in each, so one is enough
          # to show a deprecated flag.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if [ ! -s coverage.md ] || ! jq -e 'type == "object"' coverage.json > /dev/null 2>&1; then
              echo "::error::the pull-request diffs did not both run (coverage.md, coverage.json), so this job's log says nothing about deprecated flags"
              status=1
            fi
          fi

          # The binary on PATH is the version that was resolved. A cache entry
          # holding another version's binary fails here.
          bash tests/assert-omni-dev-version.sh "$VERSION" || status=1
          exit "$status"

  thin-mode-old-omni-dev:
    name: Thin mode (omni-dev without --fail-under-lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write fixtures
        run: |
          mkdir shards out
          printf 'SF:%s/README.md\nDA:1,1\nDA:2,0\nDA:3,1\nDA:4,0\nend_of_record' "$GITHUB_WORKSPACE" > shards/shard-1.lcov
          printf 'SF:%s/README.md\nDA:1,0\nDA:2,1\nDA:3,1\nDA:4,0\nend_of_record' "$GITHUB_WORKSPACE" > shards/shard-2.lcov

      # Sharded on purpose: the guard runs before "Combine shard reports", so a
      # missing combined report shows the guard stopped the action, not clap's
      # unknown-argument error at gate time (which comes after the combine).
      - name: '5a. Gate with an omni-dev that predates the flag'
        id: gate
        uses: ./
        continue-on-error: true
        with:
          version: ${{ env.OLD_OMNI_DEV }}
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/gate.lcov
          fail-under-lines: 70
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: integration.yml
          baseline-ancestor-depth: 0

      # The escape hatch the guard's own message recommends.
      - name: '5b. Same omni-dev, line gate disabled'
        id: nogate
        uses: ./
        continue-on-error: true
        with:
          version: ${{ env.OLD_OMNI_DEV }}
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/nogate.lcov
          fail-under-lines: ''
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: integration.yml
          baseline-ancestor-depth: 0

      - name: Assert every outcome
        env:
          GATE: ${{ steps.gate.outcome }}
          NOGATE: ${{ steps.nogate.outcome }}
        run: |
          status=0
          check() { # <label> <expected> <actual>
            if [ "$2" = "$3" ]; then
              echo "ok   - $1"
            else
              echo "::error::$1: expected $2, got $3"
              status=1
            fi
          }
          check "5a. gate with an omni-dev that predates the flag" failure "$GATE"
          check "5b. same omni-dev, line gate disabled" success "$NOGATE"

          if [ -e out/gate.lcov ]; then
            echo "::error::5a got past the guard: the shards were combined"
            status=1
          fi
          if [ ! -s out/nogate.lcov ]; then
            echo "::error::5b did not combine the shards"
            status=1
          fi

          # 5b is the one scenario here that gets past the guard, so on a pull
          # request it renders the diffs. See the thin-mode job for why the files.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if [ ! -s coverage.md ] || ! jq -e 'type == "object"' coverage.json > /dev/null 2>&1; then
              echo "::error::the pull-request diffs did not both run (coverage.md, coverage.json), so this job's log says nothing about deprecated flags"
              status=1
            fi
          fi

          bash tests/assert-omni-dev-version.sh "$OLD_OMNI_DEV" || status=1
          exit "$status"

  # An ARM64 Linux runner on an omni-dev release with no ARM64 asset (#19). The
  # action used to map every Linux runner to the x86_64 build, so this run would
  # have downloaded a binary it cannot execute and failed later, at the version
  # check, and never said why. It must now stop at the install step and name the
  # asset it looked for. The control is 5b: the same action inputs on an x86_64
  # runner, which must succeed. The install that succeeds on ARM64 is the ARM64 legs of
  # `thin-mode` above (#20): this job is the other half of the pair, the same runner on a
  # release without the asset. It cannot be a one-input control of them: the line gate is
  # off here, as in 5b, because 0.44.0 lacks the flag the thin-mode scenarios use.
  arm64-release-without-asset:
    name: Pre-built binary (ARM64 Linux, omni-dev without the ARM64 asset)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Write fixtures
        run: |
          mkdir shards out
          printf 'SF:%s/README.md\nDA:1,1\nDA:2,0\nDA:3,1\nDA:4,0\nend_of_record' "$GITHUB_WORKSPACE" > shards/shard-1.lcov
          printf 'SF:%s/README.md\nDA:1,0\nDA:2,1\nDA:3,1\nDA:4,0\nend_of_record' "$GITHUB_WORKSPACE" > shards/shard-2.lcov

      # 5b's action inputs, so the runner's architecture is what differs. The shards
      # are combined after the install, so a missing combined report shows where it
      # stopped.
      - name: '6. Pre-built omni-dev that has no ARM64 asset'
        id: install
        uses: ./
        continue-on-error: true
        with:
          version: ${{ env.OLD_OMNI_DEV }}
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/arm64.lcov
          fail-under-lines: ''
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: integration.yml
          baseline-ancestor-depth: 0

      - name: Assert the outcome
        env:
          INSTALL: ${{ steps.install.outcome }}
          ARCH: ${{ runner.arch }}
        run: |
          status=0
          # The scenario is only about an ARM64 runner if this is one.
          if [ "$ARCH" != ARM64 ] || [ "$(uname -m)" != aarch64 ]; then
            echo "::error::6 did not run on ARM64 Linux (runner.arch $ARCH, uname -m $(uname -m))"
            status=1
          fi

          if [ "$INSTALL" = failure ]; then
            echo "ok   - 6. pre-built omni-dev that has no ARM64 asset"
          else
            echo "::error::6. pre-built omni-dev that has no ARM64 asset: expected failure, got $INSTALL"
            status=1
          fi

          # It stopped at the install, not later.
          if [ -e out/arm64.lcov ]; then
            echo "::error::6 got past the install: the shards were combined"
            status=1
          fi

          # No binary was installed, least of all the x86_64 one that the old
          # mapping would have put here.
          if [ -e "$HOME/.cargo/bin/omni-dev" ]; then
            echo "::error::6 left an omni-dev behind at $HOME/.cargo/bin/omni-dev"
            status=1
          fi
          exit "$status"

  # A pre-built binary on a runner whose glibc is too old (#67). omni-dev's Linux binaries
  # need glibc 2.38 or newer (the x86_64 0.45.0 one: 2.38 as a hard requirement and 2.39 as
  # an optional one, which its loader reports as `weak`), and ubuntu-22.04 has 2.35. The
  # binary is found, downloaded and installed, and then cannot start, so the step that
  # prints the version has to say why: the glibc it needs, the one the runner has and the
  # two ways out. ubuntu-24.04 is the control: the same inputs on a runner whose glibc is
  # enough, which must succeed. The leg and its control differ in nothing but the runner
  # (the matrix cannot read `env`, so the version is a literal and `failure-messages`
  # repeats it, as it repeats the leg's name).
  #
  # What the leg shows that the unit test cannot: that the loader says, on a real old image,
  # what tests/fixtures/omni-dev-loader/ says it does, and that the step that prints the
  # version is where the action stops. It must run the install, not restore a binary: a cache
  # hit skips the download step, and the download step is where a binary is first put in place
  # (it ended by running the binary, so on a miss the loader's bare message stopped the action
  # there, and the first version of this job passed only because it hit a cache that another
  # job had saved). So each leg's `cache-prefix` holds the run and the attempt, as
  # `version-pin`'s does, and the last step removes the binary so the post step saves an entry
  # nothing would restore. If GitHub retires the ubuntu-22.04 image the leg ends at the
  # runner, not at the assertion.
  old-glibc:
    name: Old glibc (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            expect: failure
          - runner: ubuntu-24.04
            expect: success
    steps:
      # The full history, as `output-flag` has it: on a pull request the control gets past the
      # install and the guard to "Determine merge-base", which needs `origin/main`. The leg that
      # fails stops long before that.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write fixtures
        run: |
          mkdir shards out
          printf 'SF:%s/README.md\nDA:1,1\nDA:2,0\nDA:3,1\nDA:4,0\nend_of_record' "$GITHUB_WORKSPACE" > shards/shard-1.lcov
          printf 'SF:%s/README.md\nDA:1,0\nDA:2,1\nDA:3,1\nDA:4,0\nend_of_record' "$GITHUB_WORKSPACE" > shards/shard-2.lcov

      # Sharded on purpose, as in 6 and 7: the shards are combined after the install, so a
      # missing combined report shows where the action stopped.
      - name: '13. Pre-built omni-dev on a runner with this glibc'
        id: install
        uses: ./
        continue-on-error: true
        with:
          version: '0.45.0'
          cache-prefix: old-glibc-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}-
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/glibc.lcov
          fail-under-lines: ''
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: integration.yml
          baseline-ancestor-depth: 0

      - name: Assert the outcome
        env:
          INSTALL: ${{ steps.install.outcome }}
          EXPECT: ${{ matrix.expect }}
          LEG: ${{ matrix.runner }}
          ARCH: ${{ runner.arch }}
        run: |
          status=0
          # The scenario is only about glibc if this runner's is below what the binary needs
          # (2.38) on the failing leg and above it on the control.
          if [ "$ARCH" != X64 ] || [ "$(uname -m)" != x86_64 ]; then
            echo "::error::13 did not run on x86_64 Linux (runner.arch $ARCH, uname -m $(uname -m))"
            status=1
          fi
          glibc="$(getconf GNU_LIBC_VERSION)"
          glibc="${glibc#glibc }"
          echo "$LEG has glibc $glibc"
          if [ "$(printf '%s\n' "$glibc" 2.38 | sort -V | head -n 1)" = "$glibc" ] && [ "$glibc" != 2.38 ]; then
            old=yes
          else
            old=no
          fi
          if [ "$EXPECT" = failure ] && [ "$old" != yes ]; then
            echo "::error::13: $LEG has glibc $glibc, which is not older than the 2.38 this leg is about"
            status=1
          fi
          if [ "$EXPECT" = success ] && [ "$old" != no ]; then
            echo "::error::13: the control, $LEG, has glibc $glibc, which is older than the 2.38 it needs"
            status=1
          fi

          if [ "$INSTALL" = "$EXPECT" ]; then
            echo "ok   - 13. pre-built omni-dev on $LEG (glibc $glibc): $INSTALL"
          else
            echo "::error::13. pre-built omni-dev on $LEG (glibc $glibc): expected $EXPECT, got $INSTALL"
            status=1
          fi

          # The binary was installed on both legs: it was found and downloaded (or restored),
          # and what differs is whether it can start.
          if [ ! -e "$HOME/.cargo/bin/omni-dev" ]; then
            echo "::error::13: no omni-dev was installed at $HOME/.cargo/bin/omni-dev, so this is not the case of a binary that cannot start"
            status=1
          fi

          if [ "$EXPECT" = failure ]; then
            # Stopped at the version step, before the shards were combined.
            if [ -e out/glibc.lcov ]; then
              echo "::error::13 got past the version step: the shards were combined"
              status=1
            fi
          else
            if [ ! -s out/glibc.lcov ]; then
              echo "::error::13: the control did not get past the install: no combined report"
              status=1
            fi
            # Only a binary that starts has a version to check.
            bash tests/assert-omni-dev-version.sh 0.45.0 || status=1
          fi
          # The key cannot hit (the prefix holds the run), so what the post step would save
          # is never restored, and an entry of about 18 MiB per leg per run would push out the
          # entries the other jobs reuse. After the checks above, which need the binary.
          exit "$status"

      # Its own step, not the end of the one above: a failed assertion must not skip it, and a
      # step that fails stops the job before the post step, which then saves nothing either.
      - name: Remove the binary so the cache saves nothing
        if: always()
        run: rm -f "$HOME/.cargo/bin/omni-dev"

  # The pull-request half of the guard. The comment diff and the patch gate pass
  # `-o/--output` (omni-dev 0.32.0), and they run only on a `pull_request` event, so
  # the guard fires only there. This job runs on EVERY event and what it expects
  # depends on the event: an omni-dev without the flag must be stopped on a pull
  # request and left alone everywhere else (a fat-mode push calls no `omni-dev
  # coverage` at all, so an old pin works there today). The other-event expectations
  # first run on the push after a merge, as `pr-paths.yml` says of the baseline hit.
  #
  # Thin mode with the line gate off, so nothing but the `--output` need is in play,
  # and no cargo build. Two legs lack the flag in different ways: 0.31.0 has `coverage
  # diff` without it (clap says the argument is unexpected), and 0.28.0 has no `coverage
  # diff` to ask (clap says the subcommand is unrecognized). Both must reach the same
  # message.
  output-flag:
    name: Output flag (omni-dev ${{ matrix.omni-dev }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The newest release with no `coverage` subcommand at all (it arrived in
          # 0.29.0), so the guard's probe fails on the subcommand rather than the flag.
          - omni-dev: '0.28.0'
            has-output: false
          # The newest release with `coverage diff` but without `--output`.
          - omni-dev: '0.31.0'
            has-output: false
          # The first release with it: the floor the README documents. It differs
          # from each leg above in nothing but `version`, so it is their control on a
          # pull request, and it pins the floor exactly.
          - omni-dev: '0.32.0'
            has-output: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write fixtures
        run: |
          mkdir shards out
          printf 'SF:%s/README.md\nDA:1,1\nDA:2,0\nDA:3,1\nDA:4,0\nend_of_record' "$GITHUB_WORKSPACE" > shards/shard-1.lcov
          printf 'SF:%s/README.md\nDA:1,0\nDA:2,1\nDA:3,1\nDA:4,0\nend_of_record' "$GITHUB_WORKSPACE" > shards/shard-2.lcov

      # Sharded on purpose: the guard runs before "Combine shard reports", so a
      # missing combined report shows the guard stopped the action. clap's error
      # from the comment step comes after the combine, and its redirect into
      # `coverage.md` would leave an empty file.
      - name: '7. Pull-request path with this omni-dev'
        id: pr
        uses: ./
        continue-on-error: true
        with:
          version: ${{ matrix.omni-dev }}
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/pr.lcov
          fail-under-lines: ''
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: integration.yml
          baseline-ancestor-depth: 0

      - name: Assert the outcome
        env:
          PR: ${{ steps.pr.outcome }}
          HAS_OUTPUT: ${{ matrix.has-output }}
          # The pin, not the action's `version` output: a failed composite step
          # may expose no outputs, and this leg is expected to fail.
          VERSION: ${{ matrix.omni-dev }}
        run: |
          status=0
          check() { # <label> <expected> <actual>
            if [ "$2" = "$3" ]; then
              echo "ok   - $1"
            else
              echo "::error::$1: expected $2, got $3"
              status=1
            fi
          }
          assert() { # <label> <command...>
            local label="$1"
            shift
            if "$@" > /dev/null 2>&1; then
              echo "ok   - $label"
            else
              echo "::error::$label"
              status=1
            fi
          }

          expect=success
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$HAS_OUTPUT" = false ]; then
            expect=failure
          fi
          check "7. pull-request path, omni-dev with --output: $HAS_OUTPUT, on $GITHUB_EVENT_NAME" "$expect" "$PR"

          if [ "$expect" = failure ]; then
            # Stopped at the guard: before the shards were combined, and before the
            # comment step could create its output.
            assert "7: stopped at the guard: no report written" test ! -e out/pr.lcov
            assert "7: stopped at the guard: no comment written" test ! -e coverage.md
          else
            assert "7: got past the guard: the shards were combined" test -s out/pr.lcov
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              # Both `-o` call sites the step reaches ran: markdown and json.
              assert "7: the comment was rendered with -o markdown" test -s coverage.md
              assert "7: the percentages were rendered with -o json" jq -e 'type == "object"' coverage.json
            else
              assert "7: no diff rendered outside a pull request" test ! -e coverage.md
            fi
          fi

          bash tests/assert-omni-dev-version.sh "$VERSION" || status=1
          exit "$status"

  # `ignore-filename-regex` reaching the diff (#3). The thin-mode line gate is the one
  # `coverage diff` the action runs on every event, so it is where the filter shows on a
  # push too. The report is README.md fully covered and LICENSE not at all: 50% (4 of 8
  # lines), and 100% once LICENSE is filtered out. 8a and 8b differ only in the filter, so
  # a gate of 70 passes with it and fails without it. 8a's value holds two patterns, the
  # first matching nothing and starting with `-`, and an anchor: it filters LICENSE only if
  # the value is split at the comma, matched against the repo-relative path, and reaches
  # omni-dev as `--ignore-filename-regex=<value>` (a separate argument starting with `-`
  # is read by clap as a flag). The comment diff and the patch gate take the same filter;
  # pr-paths.yml shows that (P5, P6) where the patch is known.
  ignore-filename-regex:
    name: Ignore filename regex (omni-dev ${{ matrix.omni-dev }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 0.45.0 is the floor of the thin-mode line gate this uses; `latest` catches a
        # bad future release.
        omni-dev: ['0.45.0', 'latest']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Sharded, so that a combined report shows where 8b stopped: the combine comes
      # after the guard and before the gate.
      - name: Write fixtures
        run: |
          mkdir shards out
          printf 'SF:%s/README.md\nDA:1,1\nDA:2,1\nDA:3,1\nDA:4,1\nend_of_record' "$GITHUB_WORKSPACE" > shards/shard-1.lcov
          printf 'SF:%s/LICENSE\nDA:1,0\nDA:2,0\nDA:3,0\nDA:4,0\nend_of_record' "$GITHUB_WORKSPACE" > shards/shard-2.lcov

      - name: '8a. Line gate with LICENSE filtered out'
        id: filtered
        uses: ./
        continue-on-error: true
        with:
          version: ${{ matrix.omni-dev }}
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/filtered.lcov
          fail-under-lines: 70
          ignore-filename-regex: '-nomatch\.txt,^LICENSE$'
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: integration.yml
          baseline-ancestor-depth: 0

      # Control for 8a: only the filter differs.
      - name: '8b. The same line gate without the filter'
        id: unfiltered
        uses: ./
        continue-on-error: true
        with:
          version: ${{ matrix.omni-dev }}
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/unfiltered.lcov
          fail-under-lines: 70
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: integration.yml
          baseline-ancestor-depth: 0

      - name: Assert every outcome
        env:
          FILTERED: ${{ steps.filtered.outcome }}
          UNFILTERED: ${{ steps.unfiltered.outcome }}
          VERSION: ${{ steps.filtered.outputs.version }}
        run: |
          status=0
          check() { # <label> <expected> <actual>
            if [ "$2" = "$3" ]; then
              echo "ok   - $1"
            else
              echo "::error::$1: expected $2, got $3"
              status=1
            fi
          }
          check "8a. line gate with LICENSE filtered out" success "$FILTERED"
          check "8b. the same line gate without the filter" failure "$UNFILTERED"

          # 8b must fail at the gate, after the shards were combined.
          if [ ! -s out/unfiltered.lcov ]; then
            echo "::error::8b failed before the shards were combined, not at the gate"
            status=1
          fi

          # On a pull request both scenarios render the diffs, with the filter in 8a, and
          # the failure-messages job reads this job's log for a deprecation warning from
          # either. The files show the steps ran: a skipped step logs nothing, so a log
          # without a warning proves nothing about a step that did not run.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if [ ! -s coverage.md ] || ! jq -e 'type == "object"' coverage.json > /dev/null 2>&1; then
              echo "::error::the pull-request diffs did not both run (coverage.md, coverage.json), so this job's log says nothing about deprecated flags"
              status=1
            fi
          fi

          # The binary on PATH is the version that was resolved. A cache entry
          # holding another version's binary fails here.
          bash tests/assert-omni-dev-version.sh "$VERSION" || status=1
          exit "$status"

  # The guard for `--ignore-filename-regex` (#3), shaped like `output-flag`: the flag is
  # passed wherever a diff runs, so with the line gate off the guard fires only on a
  # `pull_request`, and this job runs on EVERY event and expects by event. An omni-dev
  # without the flag must be stopped on a pull request and left alone everywhere else (a
  # fat-mode push calls no `omni-dev coverage` at all). The other-event expectations first
  # run on the push after a merge. 0.32.0 is the newest release without the flag and has
  # `--output`, so on a pull request this flag is the guard's only complaint.
  ignore-filename-regex-flag:
    name: Ignore filename regex flag (omni-dev ${{ matrix.omni-dev }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The newest release without `--ignore-filename-regex`.
          - omni-dev: '0.32.0'
            has-flag: false
          # The first release with it: the floor the README documents. It differs from
          # the leg above in nothing but `version`, so it is that leg's control on a pull
          # request, and it pins the floor exactly.
          - omni-dev: '0.33.0'
            has-flag: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write fixtures
        run: |
          mkdir shards out
          printf 'SF:%s/README.md\nDA:1,1\nDA:2,0\nDA:3,1\nDA:4,0\nend_of_record' "$GITHUB_WORKSPACE" > shards/shard-1.lcov
          printf 'SF:%s/README.md\nDA:1,0\nDA:2,1\nDA:3,1\nDA:4,0\nend_of_record' "$GITHUB_WORKSPACE" > shards/shard-2.lcov

      # Sharded on purpose, as in `output-flag`: the guard runs before "Combine shard
      # reports", so a missing combined report shows the guard stopped the action.
      - name: '9. The filter set, with this omni-dev'
        id: filter
        uses: ./
        continue-on-error: true
        with:
          version: ${{ matrix.omni-dev }}
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/filter.lcov
          fail-under-lines: ''
          ignore-filename-regex: 'LICENSE'
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: integration.yml
          baseline-ancestor-depth: 0

      - name: Assert the outcome
        env:
          FILTER: ${{ steps.filter.outcome }}
          HAS_FLAG: ${{ matrix.has-flag }}
          # The pin, not the action's `version` output: a failed composite step
          # may expose no outputs, and this leg is expected to fail.
          VERSION: ${{ matrix.omni-dev }}
        run: |
          status=0
          check() { # <label> <expected> <actual>
            if [ "$2" = "$3" ]; then
              echo "ok   - $1"
            else
              echo "::error::$1: expected $2, got $3"
              status=1
            fi
          }
          assert() { # <label> <command...>
            local label="$1"
            shift
            if "$@" > /dev/null 2>&1; then
              echo "ok   - $label"
            else
              echo "::error::$label"
              status=1
            fi
          }

          expect=success
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$HAS_FLAG" = false ]; then
            expect=failure
          fi
          check "9. the filter set, omni-dev with --ignore-filename-regex: $HAS_FLAG, on $GITHUB_EVENT_NAME" "$expect" "$FILTER"

          if [ "$expect" = failure ]; then
            # Stopped at the guard: before the shards were combined, and before the
            # comment step could create its output.
            assert "9: stopped at the guard: no report written" test ! -e out/filter.lcov
            assert "9: stopped at the guard: no comment written" test ! -e coverage.md
          else
            assert "9: got past the guard: the shards were combined" test -s out/filter.lcov
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              # Both call sites the step reaches ran with the flag, on this omni-dev:
              # markdown and json.
              assert "9: the comment was rendered with the filter" test -s coverage.md
              assert "9: the percentages were rendered with the filter" jq -e 'type == "object"' coverage.json
            else
              assert "9: no diff rendered outside a pull request" test ! -e coverage.md
            fi
          fi

          bash tests/assert-omni-dev-version.sh "$VERSION" || status=1
          exit "$status"

  # `version: latest` when the releases API gives no release (#40). A spent rate limit
  # can last up to an hour, so after its three attempts the step reads the tag from
  # the github.com releases/latest redirect. That redirect is not a documented
  # interface and is used only when the API is already failing, so nothing else
  # would notice if GitHub changed it, or began throttling a runner's address; this
  # job, which also runs weekly, does. A token that is not one is refused by the API
  # with 401 whatever the rate limit and spends none of it, so 10's API attempts fail
  # on demand and the step has to use the redirect. The job asks the API directly,
  # with the workflow token, what "latest" is, and the redirect must have given the
  # same release: that shows on a real runner that the redirect is reachable and means
  # the API's "latest". (A second run of the action as the control would not do: with
  # the fallback it too would use the redirect whenever the API was failing.) That the
  # redirect, not the API, answered 10 is shown by the API refusing its token just
  # before; the unit tests pin that the input reaches the step, and what the step logs.
  # One install in this job, so no second omni-dev version can poison the cache. A
  # release published between the API query and the run fails the job on the two
  # differing; a re-run settles it.
  latest-redirect:
    name: Latest omni-dev (API refuses the token)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write fixtures
        run: printf 'SF:%s/README.md\nDA:1,1\nDA:2,0\nDA:3,1\nDA:4,0\nend_of_record' "$GITHUB_WORKSPACE" > single.lcov

      # Both lookups are recorded, not failed on, so the job still reports what 10 did.
      - name: 'The API refuses the token 10 sends'
        id: refused
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            -H 'Authorization: Bearer not-a-token' \
            https://api.github.com/repos/rust-works/omni-dev/releases/latest || true)
          echo "status=${status:-000}" >> "$GITHUB_OUTPUT"

      - name: 'What the API says the latest release is'
        id: reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/rust-works/omni-dev/releases/latest --jq '.tag_name // empty' || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: '10. Latest, with a token the API refuses'
        id: redirect
        uses: ./
        continue-on-error: true
        with:
          version: latest
          github-token: not-a-token
          run-coverage: false
          report: single.lcov
          fail-under-lines: ''
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: integration.yml

      - name: Assert the redirect gave the API's release
        env:
          REFUSED: ${{ steps.refused.outputs.status }}
          REFERENCE: ${{ steps.reference.outputs.tag }}
          OUTCOME: ${{ steps.redirect.outcome }}
          RELEASE_TAG: ${{ steps.redirect.outputs.release-tag }}
          VERSION: ${{ steps.redirect.outputs.version }}
        run: |
          status=0
          check() { # <label> <expected> <actual>
            if [ "$2" = "$3" ]; then
              echo "ok   - $1"
            else
              echo "::error::$1: expected $2, got $3"
              status=1
            fi
          }

          check "10 is about the redirect: the API refuses its token" 401 "$REFUSED"
          check "10. latest from the redirect, API refused" success "$OUTCOME"

          # Without a release from the API there is nothing to compare with, and an
          # empty tag would otherwise equal an empty release-tag from a failed step.
          if [ -z "$REFERENCE" ]; then
            echo "::error::the API gave no latest release to compare the redirect's with"
            status=1
          else
            check "10 resolved the release the API calls latest" "$REFERENCE" "$RELEASE_TAG"
          fi

          # On a pull request the action renders the diff twice, and the
          # failure-messages job reads this job's log for a deprecation warning from
          # either. The files show the steps ran: a skipped step logs nothing, so a
          # log without a warning proves nothing about a step that did not run.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if [ ! -s coverage.md ] || ! jq -e 'type == "object"' coverage.json > /dev/null 2>&1; then
              echo "::error::the pull-request diffs did not both run (coverage.md, coverage.json), so this job's log says nothing about deprecated flags"
              status=1
            fi
          fi

          # The binary on PATH is the version that was resolved. A cache entry
          # holding another version's binary fails here.
          bash tests/assert-omni-dev-version.sh "$VERSION" || status=1
          exit "$status"

  # A `version` written as a release tag, `v0.45.0`, through the whole install (#52).
  # `tests/resolve-version-step.test.sh` runs the strip on its own; this runs what comes
  # after it on a runner: the platform step's download URL, the install, and the
  # `version` and `release-tag` outputs a caller reads. A step that read `inputs.version`
  # instead of the resolved value would build `vv0.45.0`, which 404s (#38), and the unit
  # test would stay green.
  #
  # Only a run that reaches the download can see that, and the platform and download
  # steps are skipped on a cache hit. Left on the default key, which is the one the
  # ignore-filename-regex job's 0.45.0 leg saves and a `v0.45.0` pin resolves to, this job would hit
  # the cache after the first run on `main` and check only the outputs. So each leg
  # builds its key from the run, the attempt and its own pin (`cache-prefix`): it cannot
  # exist, and the install runs every time. The assertion step checks that it did, and
  # the last step removes the binary so the cache's post step saves nothing, since
  # nothing will ever restore a key like this. The price is that nothing here compares
  # the two spellings' keys: one built from `inputs.version` would cost a duplicate cache
  # entry, not a failure, and no test sees it.
  #
  # A leg per spelling, each its own job, so that the binary on PATH can only have come
  # from that leg's install: in one job, a second install would put it there even if the
  # first had failed at the 404. `0.45.0` is the control for `v0.45.0` (only `version`
  # and the text of the prefix that carries it differ) and must give the same outputs.
  # The matrix cannot read `env`, so the pins are literals; the outputs expected below
  # are literals too, because both spellings must come out the same.
  #
  # Thin mode with the line gate off, so nothing but the install is in play, and no cargo
  # build. The `use-prebuilt-binary: false` path compiles omni-dev and has no leg: cargo
  # refuses `v0.45.0` outright (#38). It reads the resolved `version`, which the unit test
  # pins has no `v`; nothing pins that it reads that and not `inputs.version`.
  version-pin:
    name: Pinned version (${{ matrix.pin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pin: ['v0.45.0', '0.45.0']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write fixtures
        run: printf 'SF:%s/README.md\nDA:1,1\nDA:2,1\nDA:3,1\nDA:4,1\nend_of_record' "$GITHUB_WORKSPACE" > single.lcov

      - name: '11. Install the pinned version'
        id: pin
        uses: ./
        continue-on-error: true
        with:
          version: ${{ matrix.pin }}
          cache-prefix: version-pin-${{ matrix.pin }}-${{ github.run_id }}-${{ github.run_attempt }}-
          run-coverage: false
          report: single.lcov
          fail-under-lines: ''
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: integration.yml
          baseline-ancestor-depth: 0

      - name: Assert the outcome
        env:
          INSTALL: ${{ steps.pin.outcome }}
          VERSION: ${{ steps.pin.outputs.version }}
          RELEASE_TAG: ${{ steps.pin.outputs.release-tag }}
          CACHE_HIT: ${{ steps.pin.outputs.omni-dev-cache-hit }}
          PIN: ${{ matrix.pin }}
        run: |
          status=0
          check() { # <label> <expected> <actual>
            if [ "$2" = "$3" ]; then
              echo "ok   - $1"
            else
              echo "::error::$1: expected $2, got $3"
              status=1
            fi
          }

          check "11 ($PIN): the install succeeded" success "$INSTALL"
          check "11 ($PIN): the version output has no leading v" 0.45.0 "$VERSION"
          check "11 ($PIN): the release-tag output is the v-prefixed tag" v0.45.0 "$RELEASE_TAG"

          # The install ran in this job. The key is unique to the run, the attempt and the pin
          # on every event, so nothing could have saved an entry for it: a hit means the prefix
          # never reached the action, and the platform and download steps were skipped. Without
          # this a cache hit would pass every check above. The action says whether it hit
          # (`omni-dev-cache-hit`); `check-fresh` fails on `true`, and on no value, which is how
          # a step that failed arrives.
          bash tests/install-cache.sh check-fresh "$CACHE_HIT" || status=1

          # On a pull request the diffs run, and the failure-messages job reads this
          # job's log for a deprecation warning from either. The files show they ran: a
          # skipped step logs nothing, so a log without a warning proves nothing about a
          # step that did not run.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if [ ! -s coverage.md ] || ! jq -e 'type == "object"' coverage.json > /dev/null 2>&1; then
              echo "::error::the pull-request diffs did not both run (coverage.md, coverage.json), so this job's log says nothing about deprecated flags"
              status=1
            fi
          fi

          # The binary on PATH is the version that was resolved. The action's output, not
          # the pin: a pin written with a v is not a bare release number, and passing the
          # pin without its v would repeat the action's own strip instead of testing it.
          bash tests/assert-omni-dev-version.sh "$VERSION" || status=1
          exit "$status"

      # Last, so the assertions above see the binary. The cache key is unique to this
      # run, so what the cache's post step would save is never restored: an entry of about
      # 18 MiB per leg per run (0.45.0's is 17.66 MiB), against a repository cache of
      # about 200 MB in all, which would push out the entries the other jobs reuse. With
      # no file at the cached path it saves nothing and logs a warning about the missing
      # path.
      - name: Leave nothing for the cache to save
        run: rm -f "$HOME/.cargo/bin/omni-dev"

  # The `version` input when it names no release, or names one with a capital V (#51).
  # tests/resolve-version-step.test.sh runs the step's script on each value; this runs
  # them through the action on a runner, which is what shows that a workflow's empty
  # `version` reaches the script as an empty string and is not swapped for the input's
  # `latest` default (a swap would make 12a install omni-dev and succeed, and fail here).
  #
  # Thin mode with the line gate off, so nothing but the install is in play. 12a and 12b
  # must stop at the resolve step, before the shards are combined: a missing combined
  # report shows where. 12c differs from them in `version` alone, so it is their control,
  # and it is the capital V's decision (accepted) run on a runner: the outputs are the
  # lowercase-v spelling's and the binary is that release's. It installs 0.45.0, the
  # release the thin-mode job's first leg installs, so the two write the same cache key
  # by design; each is its own job, so neither poisons the other.
  version-input:
    name: Version input
    runs-on: ubuntu-latest
    steps:
      # Full history: on a pull request 12c runs the merge-base step, which needs
      # origin/main, as in every job here that runs the pull-request path.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write fixtures
        run: |
          mkdir shards out
          printf 'SF:%s/README.md\nDA:1,1\nDA:2,0\nDA:3,1\nDA:4,0\nend_of_record' "$GITHUB_WORKSPACE" > shards/shard-1.lcov
          printf 'SF:%s/README.md\nDA:1,0\nDA:2,1\nDA:3,1\nDA:4,0\nend_of_record' "$GITHUB_WORKSPACE" > shards/shard-2.lcov

      - name: '12a. An empty version'
        id: empty
        uses: ./
        continue-on-error: true
        with:
          version: ''
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/empty.lcov
          fail-under-lines: ''
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: integration.yml
          baseline-ancestor-depth: 0

      - name: '12b. A version that is only a v'
        id: lone-v
        uses: ./
        continue-on-error: true
        with:
          version: v
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/lone-v.lcov
          fail-under-lines: ''
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: integration.yml
          baseline-ancestor-depth: 0

      - name: '12c. A release number with a capital V'
        id: capital-v
        uses: ./
        continue-on-error: true
        with:
          version: V0.45.0
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/capital-v.lcov
          fail-under-lines: ''
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: integration.yml
          baseline-ancestor-depth: 0

      - name: Assert the outcomes
        env:
          EMPTY: ${{ steps.empty.outcome }}
          LONE_V: ${{ steps.lone-v.outcome }}
          CAPITAL_V: ${{ steps.capital-v.outcome }}
          # The action's outputs, not the pin: they are what a caller reads, and the
          # strip is what this scenario is about. Empty if 12c failed, which the
          # checks below then report.
          VERSION: ${{ steps.capital-v.outputs.version }}
          RELEASE_TAG: ${{ steps.capital-v.outputs.release-tag }}
        run: |
          status=0
          check() { # <label> <expected> <actual>
            if [ "$2" = "$3" ]; then
              echo "ok   - $1"
            else
              echo "::error::$1: expected '$2', got '$3'"
              status=1
            fi
          }
          assert() { # <label> <command...>
            local label="$1"
            shift
            if "$@" > /dev/null 2>&1; then
              echo "ok   - $label"
            else
              echo "::error::$label"
              status=1
            fi
          }

          check "12a. an empty version fails the action" failure "$EMPTY"
          # Stopped at the resolve step: before the shards were combined.
          assert "12a: stopped before the shards were combined" test ! -e out/empty.lcov

          check "12b. a version that is only a v fails the action" failure "$LONE_V"
          assert "12b: stopped before the shards were combined" test ! -e out/lone-v.lcov

          check "12c. a capital V is accepted" success "$CAPITAL_V"
          assert "12c: got past the install: the shards were combined" test -s out/capital-v.lcov
          check "12c: the version output has no V" 0.45.0 "$VERSION"
          check "12c: the release-tag output has a lowercase v" v0.45.0 "$RELEASE_TAG"

          # On a pull request 12c also ran the comment and percentages diffs, and the
          # failure-messages job reads this job's log for a deprecation warning from
          # either. The files show the steps ran: a skipped step logs nothing, so a log
          # without a warning proves nothing about a step that did not run.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            assert "12c: the comment was rendered" test -s coverage.md
            assert "12c: the percentages were rendered" jq -e 'type == "object"' coverage.json
          else
            assert "12c: no diff rendered outside a pull request" test ! -e coverage.md
          fi

          bash tests/assert-omni-dev-version.sh "$VERSION" || status=1
          exit "$status"

  fat-mode:
    name: Fat mode (fixture crate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The action runs cargo at the workspace root, and a caller cannot give a
      # composite action's steps a working directory, so the committed fixture
      # crate is copied there. Only this job's checkout gets a root Cargo.toml.
      # The crate has no dependencies, so there is no lockfile to commit.
      - name: Copy the fixture crate to the workspace root
        run: |
          if [ -e Cargo.toml ] || [ -e src ]; then
            echo "::error::Cargo.toml or src/ already exists at the repository root; the fixture would overwrite it"
            exit 1
          fi
          cp -R tests/fixtures/fat-crate/. .
          mkdir out

      # Every `cargo llvm-cov report` merges all the raw profiles unless they were
      # already merged and removed, which is what the action does so that its
      # reports and gate share one merge (#4). These pass-through shims log each
      # merge, so a scenario can assert how many ran. They go in before the action,
      # which finds the real tools through them. Both are set: cargo-llvm-cov warns
      # when only one is.
      - name: Count llvm-profdata merges
        run: |
          shims="$RUNNER_TEMP/llvm-shims"
          mkdir -p "$shims"
          for tool in llvm-cov llvm-profdata; do
            ln -s "$PWD/tests/llvm-tool-shim.sh" "$shims/$tool"
          done
          {
            echo "LLVM_COV=$shims/llvm-cov"
            echo "LLVM_PROFDATA=$shims/llvm-profdata"
            echo "LLVM_SHIM_LOG=$PWD/llvm-profdata-merges.txt"
          } >> "$GITHUB_ENV"

      # The full configuration. The fixture covers 14 of 29 lines (48.3%) with
      # everything, and 8 of 29 (27.6%) without the extra command, so the gates of
      # 40 and 80 sit well either side of it. (Five of the 29 lines are
      # `src/ignored.rs`, which nothing reaches: without it it is 14 of 24, 58.3%,
      # which F5 and F6 are about.) `setup-ran.txt` is what the main
      # test needs, so it fails unless setup ran first. The setup test runs with
      # profiling off, so `setup_only` must stay uncovered; the extra test is
      # profiled, so `extra_only` must be covered. `recompute-baseline` is off
      # because the fixture is not in git history, so the merge-base worktree
      # that a pull request would build has no Cargo.toml.
      - name: 'F1. Full configuration, gate below the fixture coverage'
        id: f1
        uses: ./
        continue-on-error: true
        with:
          report: out/f1.lcov
          fail-under-lines: 40
          setup-commands: |
            echo ready > setup-ran.txt
            cargo test -- --ignored --exact tests::setup_only_works
          extra-test-commands: cargo test -- --ignored --exact tests::extra_only_works
          comment: false
          upload-artifacts: false
          publish-baseline: false
          recompute-baseline: false
          baseline-workflow: integration.yml
          baseline-ancestor-depth: 0

      - name: Move F1 outputs aside
        if: always()
        run: bash tests/move-outputs.sh f1

      # Control for F1: only the gate differs.
      - name: 'F2. Same, gate above the fixture coverage'
        id: f2
        uses: ./
        continue-on-error: true
        with:
          report: out/f2.lcov
          fail-under-lines: 80
          setup-commands: |
            echo ready > setup-ran.txt
            cargo test -- --ignored --exact tests::setup_only_works
          extra-test-commands: cargo test -- --ignored --exact tests::extra_only_works
          comment: false
          upload-artifacts: false
          publish-baseline: false
          recompute-baseline: false
          baseline-workflow: integration.yml
          baseline-ancestor-depth: 0

      - name: Move F2 outputs aside
        if: always()
        run: bash tests/move-outputs.sh f2

      # Control for F1: no extra command, so `extra_only` must now be uncovered.
      # The gate is off because 27.6% is under 40.
      - name: 'F3. Without extra-test-commands'
        id: f3
        uses: ./
        continue-on-error: true
        with:
          report: out/f3.lcov
          fail-under-lines: ''
          setup-commands: |
            echo ready > setup-ran.txt
            cargo test -- --ignored --exact tests::setup_only_works
          comment: false
          upload-artifacts: false
          publish-baseline: false
          recompute-baseline: false
          baseline-workflow: integration.yml
          baseline-ancestor-depth: 0

      - name: Move F3 outputs aside
        if: always()
        run: bash tests/move-outputs.sh f3

      # Control for F1: no setup command, so the main test fails and the action
      # stops before it writes any report.
      - name: 'F4. Without setup-commands'
        id: f4
        uses: ./
        continue-on-error: true
        with:
          report: out/f4.lcov
          fail-under-lines: 40
          extra-test-commands: cargo test -- --ignored --exact tests::extra_only_works
          comment: false
          upload-artifacts: false
          publish-baseline: false
          recompute-baseline: false
          baseline-workflow: integration.yml
          baseline-ancestor-depth: 0

      - name: Move F4 outputs aside
        if: always()
        run: bash tests/move-outputs.sh f4

      # F5 and F6 are about `llvm-cov-ignore-filename-regex`. `src/ignored.rs` is
      # reached by nothing: 5 of the 29 lines and none of the 14 covered, so the
      # fixture is at 48.3% with it and 58.3% without. The gate of 53 sits between
      # the two (4.7 under one, 5.3 over the other), so F5 passes only if the line
      # gate itself is filtered. The pattern has a `\` and a `$`, which have to
      # reach cargo-llvm-cov as they are, and matches the ABSOLUTE path.
      - name: 'F5. The filter leaves the unreachable file out of every report'
        id: f5
        uses: ./
        continue-on-error: true
        with:
          report: out/f5.lcov
          fail-under-lines: 53
          llvm-cov-ignore-filename-regex: 'src/ignored\.rs$'
          setup-commands: |
            echo ready > setup-ran.txt
            cargo test -- --ignored --exact tests::setup_only_works
          extra-test-commands: cargo test -- --ignored --exact tests::extra_only_works
          comment: false
          upload-artifacts: false
          publish-baseline: false
          recompute-baseline: false
          baseline-workflow: integration.yml
          baseline-ancestor-depth: 0

      - name: Move F5 outputs aside
        if: always()
        run: bash tests/move-outputs.sh f5

      # Control for F5: only the filter is off, so the same run is under the gate,
      # and fails there with every report written.
      - name: 'F6. Same, without the filter'
        id: f6
        uses: ./
        continue-on-error: true
        with:
          report: out/f6.lcov
          fail-under-lines: 53
          setup-commands: |
            echo ready > setup-ran.txt
            cargo test -- --ignored --exact tests::setup_only_works
          extra-test-commands: cargo test -- --ignored --exact tests::extra_only_works
          comment: false
          upload-artifacts: false
          publish-baseline: false
          recompute-baseline: false
          baseline-workflow: integration.yml
          baseline-ancestor-depth: 0

      - name: Move F6 outputs aside
        if: always()
        run: bash tests/move-outputs.sh f6

      - name: Assert every outcome
        env:
          F1: ${{ steps.f1.outcome }}
          F2: ${{ steps.f2.outcome }}
          F3: ${{ steps.f3.outcome }}
          F4: ${{ steps.f4.outcome }}
          F5: ${{ steps.f5.outcome }}
          F6: ${{ steps.f6.outcome }}
          VERSION: ${{ steps.f1.outputs.version }}
        run: |
          status=0
          check() { # <label> <expected> <actual>
            if [ "$2" = "$3" ]; then
              echo "ok   - $1"
            else
              echo "::error::$1: expected $2, got $3"
              status=1
            fi
          }
          assert() { # <label> <command...>
            local label="$1"
            shift
            if "$@" > /dev/null 2>&1; then
              echo "ok   - $label"
            else
              echo "::error::$label"
              status=1
            fi
          }
          # Whether a function's declaration line is covered in an lcov report:
          # covered, uncovered, or missing (no record for it). The line comes from
          # the fixture because the FN records carry hash-suffixed mangled names.
          # Only src/lib.rs's records are read: the report has src/ignored.rs too,
          # and a line number means a different line in each file.
          state() { # <lcov> <function>
            local line
            line="$(grep -n "pub fn $2(" src/lib.rs | head -1 | cut -d: -f1)"
            awk -F'[:,]' -v line="$line" '
              $1 == "SF" { in_lib = ($2 ~ /\/src\/lib\.rs$/) }
              in_lib && $1 == "DA" && $2 == line { print ($3 > 0 ? "covered" : "uncovered"); found = 1 }
              END { if (!found) print "missing" }' "$1"
          }
          # The same for codecov.json, which keeps each line's hits as "hit/total".
          codecov_state() { # <codecov.json> <function>
            local line
            line="$(grep -n "pub fn $2(" src/lib.rs | head -1 | cut -d: -f1)"
            jq -r --arg line "$line" '
              [.coverage | to_entries[] | select(.key | endswith("/src/lib.rs")) | .value[$line] // empty]
              | first // "missing"
              | if . == "missing" then .
                elif (split("/")[0] | tonumber) > 0 then "covered"
                else "uncovered" end' "$1"
          }

          # Both figures are numbers, and the first is under the second: a figure that
          # is missing (an empty summary, a report that was not written) must not pass.
          # Both are run through `assert`, which shellcheck does not see as a call.
          # shellcheck disable=SC2329
          lt() { # <a> <b>
            [[ "$1" =~ ^[0-9]+(\.[0-9]+)?$ && "$2" =~ ^[0-9]+(\.[0-9]+)?$ ]] \
              && awk -v a="$1" -v b="$2" 'BEGIN { exit !(a < b) }'
          }
          # The same percentage to within rounding: llvm-cov and lcov-percent.sh can
          # round a value that ends in a 5 to different neighbours.
          # shellcheck disable=SC2329
          near() { # <a> <b>
            [[ "$1" =~ ^[0-9]+(\.[0-9]+)?$ && "$2" =~ ^[0-9]+(\.[0-9]+)?$ ]] \
              && awk -v a="$1" -v b="$2" 'BEGIN { d = a - b; exit !(d < 0.02 && d > -0.02) }'
          }
          # The summary's line coverage, without the `%`.
          summary_total() { # <coverage-summary.txt>
            awk '/^TOTAL/ { sub("%", "", $10); print $10 }' "$1"
          }

          check "F1. full configuration, gate below the coverage" success "$F1"
          check "F2. same, gate above the coverage" failure "$F2"
          check "F3. without extra-test-commands" success "$F3"
          check "F4. without setup-commands" failure "$F4"
          check "F5. the filter, gate between the filtered and the unfiltered coverage" success "$F5"
          check "F6. same, without the filter" failure "$F6"

          # F1: the three outputs exist and are well formed.
          assert "F1: codecov.json names src/lib.rs" \
            jq -e '.coverage | keys | any(endswith("/src/lib.rs"))' out/f1/codecov.json
          assert "F1: the lcov report has a record for src/lib.rs" \
            grep -q '^SF:.*/src/lib\.rs$' out/f1.lcov
          assert "F1: the summary has a TOTAL row" \
            grep -q '^TOTAL' out/f1/coverage-summary.txt

          # F1: which part of the run reached which function.
          check "F1: main_run, from the main test run" covered "$(state out/f1.lcov main_run)"
          check "F1: extra_only, from extra-test-commands" covered "$(state out/f1.lcov extra_only)"
          check "F1: setup_only, run with profiling off" uncovered "$(state out/f1.lcov setup_only)"
          check "F1: never, reached by nothing" uncovered "$(state out/f1.lcov never)"
          # codecov.json is read from the profile the lcov step merged, so its hit
          # counts must say what the lcov's do. Naming a file proves nothing about
          # them, and a stale or empty profile would still name src/lib.rs.
          for fn in main_run extra_only setup_only never; do
            check "F1: codecov.json agrees with the lcov on $fn" \
              "$(state out/f1.lcov "$fn")" "$(codecov_state out/f1/codecov.json "$fn")"
          done
          # Without this, setup_only could be uncovered only because its test
          # never ran.
          assert "F1: the setup test ran" test -e out/f1/setup-test-ran.txt
          assert "F1: the main test ran" test -e out/f1/main-test-ran.txt

          # F2 must fail at the gate, after every output was written.
          assert "F2: stopped at the gate: codecov.json written" test -s out/f2/codecov.json
          assert "F2: stopped at the gate: lcov written" test -s out/f2.lcov
          assert "F2: stopped at the gate: summary written" test -s out/f2/coverage-summary.txt

          # F3 differs from F1 only in the extra command.
          check "F3: main_run still covered" covered "$(state out/f3.lcov main_run)"
          check "F3: extra_only uncovered without the extra command" uncovered "$(state out/f3.lcov extra_only)"

          # F4 must fail in the main test run, before any report. The test leaves
          # a marker before it checks for the setup's file, so the marker shows
          # the failure came from the test and not from an earlier step.
          assert "F4: stopped in the main test: it ran" test -e out/f4/main-test-ran.txt
          assert "F4: stopped in the main test: no lcov" test ! -e out/f4.lcov
          assert "F4: stopped in the main test: no codecov.json" test ! -e out/f4/codecov.json

          # One profile merge per run (#4). Left alone, each of the codecov, lcov and
          # summary reports and the line gate merges every raw profile again, which
          # is 4 merges in F1 and F2 and 3 in F3. The lcov report merges and removes
          # the raw profiles, and the others read the merged profile. F2's gate is
          # the last call of all, and it ran (it failed the step), so its count of 1
          # covers every call. F4 stops in the test run, before any report: the log
          # reads 0 when nothing merged, which makes the 1s above counts and not
          # just the presence of a file.
          merges() { # <log>; the log does not exist until the first merge
            if [ -e "$1" ]; then wc -l < "$1" | tr -d ' '; else echo 0; fi
          }
          check "F1: the raw profiles were merged once" 1 "$(merges out/f1/llvm-profdata-merges.txt)"
          check "F2: merged once, the gate included" 1 "$(merges out/f2/llvm-profdata-merges.txt)"
          check "F3: merged once, without the gate" 1 "$(merges out/f3/llvm-profdata-merges.txt)"
          check "F4: nothing merged before the failing test" 0 "$(merges out/f4/llvm-profdata-merges.txt)"

          # F5: `src/ignored.rs` is out of every report the action wrote and `src/lib.rs`
          # is not, so the filter reached the lcov, codecov.json and the summary, and
          # kept the rest. A run of the same fixture without it is F6, below.
          assert "F5: the lcov has no record for src/ignored.rs" \
            test "$(grep -c '^SF:.*/src/ignored\.rs$' out/f5.lcov)" = 0
          assert "F5: the lcov still has src/lib.rs" grep -q '^SF:.*/src/lib\.rs$' out/f5.lcov
          assert "F5: codecov.json does not name src/ignored.rs" \
            jq -e '.coverage | keys | any(endswith("/src/ignored.rs")) | not' out/f5/codecov.json
          assert "F5: codecov.json still names src/lib.rs" \
            jq -e '.coverage | keys | any(endswith("/src/lib.rs"))' out/f5/codecov.json
          assert "F5: the summary has no row for ignored.rs" \
            test "$(grep -c 'ignored\.rs' out/f5/coverage-summary.txt)" = 0
          assert "F5: the summary has a TOTAL row" grep -q '^TOTAL' out/f5/coverage-summary.txt
          # The files that stayed were measured as in F1: only a file was dropped, not
          # coverage.
          for fn in main_run extra_only setup_only never; do
            check "F5: $fn is as in F1" "$(state out/f1.lcov "$fn")" "$(state out/f5.lcov "$fn")"
          done
          total5="$(summary_total out/f5/coverage-summary.txt)"
          total6="$(summary_total out/f6/coverage-summary.txt)"
          assert "F5: the summary's total ($total5) is the filtered lcov's ($(bash tests/lcov-percent.sh out/f5.lcov))" \
            near "$total5" "$(bash tests/lcov-percent.sh out/f5.lcov)"
          # The gate is what decided F5, and the filter reached it: the unfiltered
          # figure (F6's) is under 53, so only a filtered gate can pass.
          assert "F5: the filtered total ($total5) is over the gate of 53" lt 53 "$total5"
          assert "F6: the unfiltered total ($total6) is under the gate of 53" lt "$total6" 53
          check "F5: the raw profiles were merged once" 1 "$(merges out/f5/llvm-profdata-merges.txt)"

          # F6 stops at the gate, after every report is written, and keeps the file.
          assert "F6: stopped at the gate: lcov written" test -s out/f6.lcov
          assert "F6: stopped at the gate: codecov.json written" test -s out/f6/codecov.json
          assert "F6: stopped at the gate: summary written" test -s out/f6/coverage-summary.txt
          assert "F6: the lcov has a record for src/ignored.rs" grep -q '^SF:.*/src/ignored\.rs$' out/f6.lcov
          assert "F6: codecov.json names src/ignored.rs" \
            jq -e '.coverage | keys | any(endswith("/src/ignored.rs"))' out/f6/codecov.json
          assert "F6: the summary has a row for ignored.rs" grep -q 'ignored\.rs' out/f6/coverage-summary.txt
          check "F6: the raw profiles were merged once" 1 "$(merges out/f6/llvm-profdata-merges.txt)"

          # The comment is built on pull requests only. Its total is the report's
          # own total, so it shows the diff was rendered from F1's report.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            total="$(awk '/^TOTAL/ { print $10 }' out/f1/coverage-summary.txt)"
            assert "F1: the pull-request comment reports the run's total ($total)" \
              grep -qF "Total: **$total**" out/f1/coverage.md
            # The other diff, which the failure-messages job reads this job's log
            # for a deprecation warning from. The comment's file shows the first ran.
            assert "F1: the percentages were rendered with -o json" \
              jq -e 'type == "object"' out/f1/coverage.json
            # F5's comment is rendered from the filtered report, so it carries the
            # filtered total, which F1's (48.3%) is not.
            assert "F5: the pull-request comment reports the filtered total ($total5%)" \
              grep -qF "Total: **$total5%**" out/f5/coverage.md
          else
            assert "F1: no diff rendered outside a pull request" test ! -e out/f1/coverage.md
            assert "F5: no diff rendered outside a pull request" test ! -e out/f5/coverage.md
          fi

          # The binary on PATH is the version that was resolved. A cache entry
          # holding another version's binary fails here.
          bash tests/assert-omni-dev-version.sh "$VERSION" || status=1
          exit "$status"

  # The control for the deprecation check in `failure-messages` (#23). No other job
  # should log an omni-dev deprecation warning, and a reader that cannot see one
  # reports the same empty result. This job logs one on purpose: it calls omni-dev
  # directly with the flag the action no longer passes, and the action is here only
  # to install omni-dev (it passes `-o`). It differs from a scenario in that call and
  # nothing else.
  # `latest`, so that if omni-dev rewords the warning or removes the flag, this is
  # where it shows, and the message there says what to do. `|| rc=$?` because a
  # removed flag is an error, and what to say about it is the reader's, below.
  deprecation-control:
    name: Deprecation warning (control)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write fixtures
        run: printf 'SF:%s/README.md\nDA:1,1\nDA:2,0\nend_of_record' "$GITHUB_WORKSPACE" > single.lcov

      - name: 'D1. Install omni-dev through the action'
        uses: ./
        with:
          version: latest
          run-coverage: false
          report: single.lcov
          fail-under-lines: ''
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: integration.yml
          baseline-ancestor-depth: 0

      - name: 'D2. Pass the deprecated flag to omni-dev directly'
        run: |
          rc=0
          omni-dev coverage diff --report single.lcov --base-ref HEAD --format json > /dev/null || rc=$?
          echo "omni-dev exited $rc"

      # The control for the guard's probe (#36), here because it needs the same thing as
      # D2: omni-dev on `latest`. The guard in action.yml counts a flag as present unless
      # clap says `unexpected argument '<flag>' found`, so a clap that rewords it makes the
      # guard pass on every omni-dev that lacks a flag, and no scenario would show it: the
      # ones that expect the guard to stop run pinned releases, whose wording cannot change.
      # A flag that cannot exist must still get that message, asked as the probe asks
      # (NO_COLOR=1, a dummy value, `--help`).
      - name: "D3. Ask omni-dev about a flag that cannot exist, as the guard's probe does"
        run: |
          said="$(NO_COLOR=1 omni-dev coverage diff --no-such-flag x --help 2>&1 || true)"
          printf '%s\n' "$said"
          if ! grep -Fq "error: unexpected argument '--no-such-flag' found" <<<"$said"; then
            echo "::error::$(omni-dev --version) no longer says \"error: unexpected argument '<flag>' found\" for an unknown flag, so the guard in action.yml (has_flag) would count every missing flag as present. Update its match, and tests/fixtures/omni-dev-probe/."
            exit 1
          fi

  # Six of the scenarios above exist mainly for their message, which is what a
  # user reads: a shard pattern that matches nothing must name the pattern, a
  # guard that finds no `--fail-under-lines`, `--output` or `--ignore-filename-regex`
  # must say how to fix it, a release with no asset for the runner's
  # architecture must name the asset, and a `version` that names no release must
  # name the input. A step cannot read its own job's log and a
  # composite action's failing step exposes no output, so the outcome and file
  # checks above pin the step order, not the text. This job reads the finished
  # jobs' logs instead. It reads them for a second thing: on a pull request, the
  # jobs that ran the diffs must not have logged an omni-dev deprecation warning,
  # and the control job must have.
  failure-messages:
    name: Failure messages
    # Skipped when a scenario job is red: the run is red already, and a scenario
    # that did not run as intended would only add "message missing" errors that
    # bury the cause.
    needs:
      - thin-mode
      - thin-mode-old-omni-dev
      - arm64-release-without-asset
      - old-glibc
      - output-flag
      - ignore-filename-regex
      - ignore-filename-regex-flag
      - latest-redirect
      - version-pin
      - version-input
      - fat-mode
      - deprecation-control
    runs-on: ubuntu-latest
    # The only job here with `actions: read`, which reading a job's log needs.
    # `contents: read` is the checkout: a job-level `permissions` drops the rest.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Assert the failure messages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          # expect <label> <messages> <fragment>...: passes when ONE message holds
          # every fragment (each fragment narrows the lines to those that contain
          # it), so two different messages cannot add up to a pass. Fragments are
          # fixed strings. The messages are a job's errors, or its warnings (10).
          expect() {
            local label=$1 errors=$2 matching=$2 line fragment
            shift 2
            for fragment in "$@"; do
              matching="$(grep -F -- "$fragment" <<<"$matching" || true)"
            done
            if [ -n "$matching" ]; then
              echo "ok   - $label"
              return 0
            fi
            echo "::error::$label: no single message holds all of:$(printf " '%s'" "$@")"
            echo "the job logged:"
            if [ -n "$errors" ]; then
              while IFS= read -r line; do echo "  $line"; done <<<"$errors"
            else
              echo "  (no lines)"
            fi
            status=1
          }

          # 4: a shard pattern that matches nothing names the pattern. Every leg of
          # the thin-mode matrix runs it; keep the legs in step with that matrix (each is
          # the job's name with the version, then `, ARM64` on an ARM64 runner). The
          # pattern is the one in scenario 4's `shard-reports`.
          for leg in '0.45.0' 'latest' '0.46.0, ARM64' 'latest, ARM64'; do
            if errors="$(bash tests/job-errors.sh "Thin mode (omni-dev $leg)")"; then
              expect "4 (omni-dev $leg): the pattern that matched nothing is named" "$errors" \
                "shard-reports pattern 'shards/missing-*.lcov' matched no files"
            else
              status=1
            fi
          done

          # 5a: the guard names the omni-dev it found and both ways out. The job
          # name is the one `thin-mode-old-omni-dev` sets above. Every check holds
          # the guard's own first words, so each is about its message and no other.
          guard="has no 'coverage diff --fail-under-lines'"
          if errors="$(bash tests/job-errors.sh 'Thin mode (omni-dev without --fail-under-lines)')"; then
            expect "5a: the guard names the omni-dev it found" "$errors" \
              "omni-dev $OLD_OMNI_DEV" "$guard"
            expect "5a: the guard says to set 'version' to a release with the flag" "$errors" \
              "$guard" "Set 'version' to a release that includes it"
            expect "5a: the guard says to set 'fail-under-lines' to an empty string" "$errors" \
              "$guard" "set 'fail-under-lines' to an empty string"
          else
            status=1
          fi

          # 6: a release with no asset for the runner's architecture names the release
          # and the asset it looked for, and gives both ways out. The job name is the
          # one `arm64-release-without-asset` sets above. Every check holds the asset's
          # own name, so a message about another file cannot satisfy it.
          asset="omni-dev-linux-arm64.tar.gz"
          if errors="$(bash tests/job-errors.sh 'Pre-built binary (ARM64 Linux, omni-dev without the ARM64 asset)')"; then
            expect "6: the release and the missing asset are named" "$errors" \
              "omni-dev v$OLD_OMNI_DEV has no pre-built $asset" "Linux ARM64"
            expect "6: the message says to set 'version' to a release that has the asset" "$errors" \
              "$asset" "Set 'version' to a release that has it"
            expect "6: the message says to build from source" "$errors" \
              "$asset" "set 'use-prebuilt-binary: false' to build from source"
          else
            status=1
          fi

          # 13: a pre-built binary on a runner whose glibc is too old names the release and
          # the platform, the glibc its loader says it needs (the newest non-weak one: 2.38
          # for the 0.45.0 x86_64 binary) and the one the runner has (ubuntu-22.04: 2.35), and
          # gives both ways out. The job name is the one `old-glibc` sets; its control leg on
          # ubuntu-24.04 succeeds and has no message to read. Every check holds the glibc the
          # message asks for, so a message about another version cannot satisfy it.
          if errors="$(bash tests/job-errors.sh 'Old glibc (ubuntu-22.04)')"; then
            expect "13: the release and the platform are named" "$errors" \
              "omni-dev 0.45.0 cannot run on this runner (Linux X64)"
            expect "13: the glibc it needs and the one the runner has" "$errors" \
              "it needs glibc 2.38 or newer, and the runner has glibc 2.35."
            expect "13: the first way out is a newer runner image" "$errors" \
              "it needs glibc 2.38 or newer" \
              "Use a runner image with glibc 2.38 or newer (ubuntu-24.04, or ubuntu-24.04-arm)"
            expect "13: the second way out is to build from source" "$errors" \
              "it needs glibc 2.38 or newer" \
              "set 'use-prebuilt-binary: false' to build omni-dev from source."
          else
            status=1
          fi

          # 7: on a pull request the `--output` guard names the omni-dev it found, the
          # floor and the way out. Only a pull request runs it, so on any other event
          # the legs without the flag succeed and have no message to read. Both legs
          # without it must reach the same message: 0.31.0 has `coverage diff` without
          # the flag, and 0.28.0 has no `coverage diff` at all, so its probe fails on
          # the subcommand before any flag is looked at. The job names are the ones
          # `output-flag` sets above; keep the versions in step with its matrix. The
          # version is a fragment of its own because `omni-dev --version` can carry a
          # commit and date after it.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            guard="has no 'coverage diff --output'"
            for version in 0.28.0 0.31.0; do
              if errors="$(bash tests/job-errors.sh "Output flag (omni-dev $version)")"; then
                expect "7 (omni-dev $version): the guard names the omni-dev it found" "$errors" \
                  "omni-dev $version" "$guard"
                expect "7 (omni-dev $version): the guard names the 0.32.0 floor" "$errors" \
                  "$guard" "It needs omni-dev 0.32.0 or later"
                expect "7 (omni-dev $version): the guard says to set 'version' to the floor or 'latest'" "$errors" \
                  "$guard" "set 'version' to 0.32.0 or later, or to 'latest'"
              else
                status=1
              fi
            done
          fi

          # 9: on a pull request the `--ignore-filename-regex` guard names the omni-dev it
          # found, the floor and both ways out. Only a pull request runs it in the job
          # below (the line gate is off), so on any other event the leg without the flag
          # succeeds and has no message to read. The job name is the one
          # `ignore-filename-regex-flag` sets above; keep the version in step with its matrix.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            guard="has no 'coverage diff --ignore-filename-regex'"
            if errors="$(bash tests/job-errors.sh 'Ignore filename regex flag (omni-dev 0.32.0)')"; then
              expect "9: the guard names the omni-dev it found" "$errors" \
                "omni-dev 0.32.0" "$guard"
              expect "9: the guard names the 0.33.0 floor" "$errors" \
                "$guard" "It needs omni-dev 0.33.0 or later"
              expect "9: the guard says to set 'version' to the floor or 'latest'" "$errors" \
                "$guard" "set 'version' to 0.33.0 or later, or to 'latest'"
              expect "9: the guard says to set 'ignore-filename-regex' to an empty string" "$errors" \
                "$guard" "set 'ignore-filename-regex' to an empty string"
            else
              status=1
            fi
          fi
          # 10: with a token the API refuses, the resolve step logs one warning that
          # says the redirect answered in its place (#61). The scenario's own checks
          # show the outcome (the API refused, the release equals the API's); this is
          # what shows that the redirect answered and not the API, which the outcome
          # alone does not. The job's log holds three `Attempt n/3` warnings that name
          # the API's reason too, so every check holds the fallback's own words and
          # all of them must be in ONE warning: the reason, the redirect, and the way out.
          # A reworded warning, or the workflow token reaching the scenario (so that the
          # API answers and no fallback is logged), fails these. The job name is the one
          # `latest-redirect` sets above.
          fallback="so latest omni-dev was resolved from the github.com releases/latest redirect instead: v"
          if warnings="$(bash tests/job-warnings.sh 'Latest omni-dev (API refuses the token)')"; then
            expect "10: the fallback's warning names the API's reason" "$warnings" \
              "$fallback" "(API: Bad credentials)"
            expect "10: the fallback's warning says the redirect answered, with the tag" "$warnings" \
              "(API: Bad credentials)" "$fallback"
            expect "10: the fallback's warning offers pinning 'version'" "$warnings" \
              "$fallback" "set 'version' to a release to skip the lookup"
          else
            status=1
          fi
          # 12: a version that names no release is refused by the resolve step, whose one
          # message names the input, quotes what it got and offers both ways out. Every
          # check holds the message's own first words and the value it quotes, so each is
          # about its own scenario's message: 12a's is empty and 12b's is `v`. Both run on
          # every event. The job name is the one `version-input` sets above.
          refused="The 'version' input names no release"
          if errors="$(bash tests/job-errors.sh 'Version input')"; then
            expect "12a: an empty version is refused, and the message quotes it" "$errors" \
              "$refused" "(got '')"
            expect "12b: a version that is only a v is refused, and the message quotes it" "$errors" \
              "$refused" "(got 'v')"
            expect "12a: the message offers a release number" "$errors" \
              "$refused" "(got '')" "a release number such as 0.45.0"
            expect "12b: the message offers a release number" "$errors" \
              "$refused" "(got 'v')" "a release number such as 0.45.0"
            expect "12a: the message offers 'latest'" "$errors" \
              "$refused" "(got '')" "or to 'latest'"
            expect "12b: the message offers 'latest'" "$errors" \
              "$refused" "(got 'v')" "or to 'latest'"
          else
            status=1
          fi
          exit "$status"

      # What omni-dev says about a flag the action passes, read from the same logs.
      # The control runs on every event; the absence checks on a pull request only,
      # because the diffs they are about run on a pull request alone. The jobs that
      # run them show with a file check, in their own assertion steps, that they did.
      # A separate check of the same logs, so it runs when the messages above fail too.
      - name: Assert the deprecation warnings
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          status=0

          # The control passes the deprecated flag on purpose, so its log holds the
          # warning. Finding none means the reader cannot see a warning, or omni-dev
          # no longer prints this one, and then every check below would pass for
          # nothing. The warning is matched on the flag and what to use instead, not
          # on its wording, so a reworded message that still names both passes.
          control='Deprecation warning (control)'
          if lines="$(bash tests/job-deprecations.sh "$control")"; then
            matching="$(grep -F -- '--format' <<<"$lines" || true)"
            if grep -qF -- '-o/--output' <<<"$matching"; then
              echo "ok   - control: the warning for the flag it passes on purpose is found"
            else
              echo "::error::control: no deprecation warning names '--format' and '-o/--output' in '$control'. If omni-dev reworded it, update tests/job-deprecations.sh; if it removed the flag, retire this control."
              echo "the job logged:"
              if [ -n "$lines" ]; then
                while IFS= read -r line; do echo "  $line"; done <<<"$lines"
              else
                echo "  (no deprecation lines)"
              fi
              status=1
            fi
          else
            status=1
          fi

          # Every other job of the run that finished green, found through the API, so
          # a new job or matrix leg is read without being added to a list. This job
          # is still running, so it is not among them, and the control is read above.
          # A job that stops at a guard (output-flag 0.31.0, the ARM64 job) logs none,
          # which is the right answer for it. The jobs that run the diffs show with a
          # file check, in their own assertion steps, that they did.
          #
          # The list is what decides which logs are read, so a list that is short makes
          # the check read fewer jobs and pass (#89). tests/run-jobs.sh looks again at a
          # failed call, a body that is not JSON, a list that disagrees with the API's own
          # count, and a list shorter than this: every job this one needs, and this one.
          # That is a lower bound, since a matrix job is several jobs: it catches a list
          # that is badly short and does not prove the rest complete.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if ! min="$(jq 'length + 1' <<<"$NEEDS")"; then
              echo "::error::the jobs this one needs could not be read, so the job list cannot be held to a minimum"
              status=1
            elif jobs="$(RUN_JOBS_MIN="$min" bash tests/run-jobs.sh)"; then
              names="$(jq -r --arg control "$control" \
                '.[] | select(.conclusion == "success" and .name != $control) | .name' <<<"$jobs")"
              if [ -z "$names" ]; then
                echo "::error::the run has no finished job to read the log of, so nothing was checked"
                status=1
              fi
              while IFS= read -r job; do
                [ -n "$job" ] || continue
                if lines="$(bash tests/job-deprecations.sh "$job" </dev/null)"; then
                  if [ -z "$lines" ]; then
                    echo "ok   - $job: no deprecation warning"
                  else
                    echo "::error::$job logged a deprecation warning. If omni-dev printed it, action.yml passes a flag omni-dev has deprecated: stop passing it and add it to tests/check-deprecated-flags.sh. If another tool did, see what it deprecated."
                    while IFS= read -r line; do echo "  $line"; done <<<"$lines"
                    status=1
                  fi
                else
                  status=1
                fi
              done <<<"$names"
            else
              status=1
            fi
          fi
          exit "$status"

  # The one check of this workflow that the merge queue's ruleset requires (#76). It
  # fails unless every job above succeeded, `skipped` included: GitHub counts a skipped
  # required check as passing, and `failure-messages` is skipped whenever a scenario
  # fails, so requiring only that job would let a red pull request through. `always()`
  # so it runs, and is red, when a job it needs failed. The results reach
  # tests/ci-gate.sh through `env:`, not as an expression in the script (#39).
  # `needs` names every other job in the file: tests/merge-queue.test.sh fails when one
  # is missing, since a job left out would be a job nothing waits for.
  ci-gate:
    name: ci-gate
    needs:
      - thin-mode
      - thin-mode-old-omni-dev
      - arm64-release-without-asset
      - old-glibc
      - output-flag
      - ignore-filename-regex
      - ignore-filename-regex-flag
      - latest-redirect
      - version-pin
      - version-input
      - fat-mode
      - deprecation-control
      - failure-messages
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail unless every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: bash tests/ci-gate.sh
