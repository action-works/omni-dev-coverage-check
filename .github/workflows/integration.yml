name: Integration

# Runs the action itself (`uses: ./`) on a real runner on every change: in thin
# mode against fixture lcov files (the thin-mode line gate and `shard-reports`,
# `ignore-filename-regex`, and the `--output` floor a pull request needs), and in
# fat mode against a fixture crate (the instrumented test run, the three report
# outputs, the fat-mode line gate, `setup-commands`/`extra-test-commands`). Each
# scenario's outcome is asserted at the end of its job; the scenarios are
# `continue-on-error` so one regression does not hide the rest. What the five
# scenarios that exist for their message said is asserted by the last job, which
# reads the finished jobs' logs through the API. On a pull request it also asserts that none of the jobs that
# ran the pull-request steps logged an omni-dev deprecation warning, and a control
# job that logs one on purpose shows that reading can find it. One job runs on an
# ARM64 Linux runner, to show that the pre-built binary is chosen by architecture.
#
# Rules that keep these tests honest:
#   - One omni-dev version per job. `actions/cache` saves in a post step, after
#     every scenario has run, and saves whatever is at ~/.cargo/bin/omni-dev
#     then; a second version installed over it poisons the first version's key.
#     A job that asserts its scenarios' outcomes ends on
#     tests/assert-omni-dev-version.sh, which fails unless the binary on PATH is
#     exactly the version the job pinned. `arm64-release-without-asset` installs
#     nothing and `deprecation-control` has one install and asserts no outcome, so
#     neither calls it.
#   - Every scenario expected to fail has a control that differs in exactly one
#     input and must succeed, plus a file check showing where the action stopped.
#     `outcome == failure` alone also holds when the install breaks.
#   - Fat-mode scenarios share the workspace, and the action writes some outputs
#     to fixed names, so each scenario's outputs are moved to out/<id>/ before the
#     next one runs. Otherwise a later scenario's checks could pass on an earlier
#     one's leftovers.
#   - A message is read from the job's `##[error]` lines and nowhere else in the
#     log. The log also echoes every step's script, which holds the same message
#     text whether or not the step ran it, so a grep of the whole log would pass
#     for the wrong reason. tests/job-errors.sh does the reading.
#   - A deprecation warning is read from the lines a program printed (`warning:`
#     right after the timestamp), for the same reason: the echo of a script can hold
#     the words. tests/job-deprecations.sh does the reading. It can speak only for the
#     steps a job ran, and a skipped step logs nothing, so each job it reads also
#     shows, with a file check, that the pull-request steps ran: an empty read of a
#     job that skipped them would prove nothing. The control job is the other half:
#     a read that finds nothing anywhere would pass every one of those checks.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1' # weekly: notice a bad omni-dev release without waiting for a PR
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The newest release WITHOUT `coverage diff --fail-under-lines`, which the
  # action's guard step detects. It stays put when the floor in the thin-mode
  # matrix is raised. Shared by the job that runs it and the job that checks what
  # the guard said about it.
  OLD_OMNI_DEV: '0.44.0'

jobs:
  thin-mode:
    name: Thin mode (omni-dev ${{ matrix.omni-dev }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 0.45.0 is the first release with `coverage diff --fail-under-lines`: the
        # floor the README documents. `latest` catches a bad future release.
        omni-dev: ['0.45.0', 'latest']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Real llvm-cov shape: no newline after the final end_of_record. Each shard
      # alone covers 2 of 4 lines (50%); their union covers 3 of 4 (75%), so a gate
      # of 70 passes only if the shards were merged.
      - name: Write fixtures
        run: |
          mkdir shards out
          printf 'SF:%s/README.md\nDA:1,1\nDA:2,0\nDA:3,1\nDA:4,0\nend_of_record' "$GITHUB_WORKSPACE" > shards/shard-1.lcov
          printf 'SF:%s/README.md\nDA:1,0\nDA:2,1\nDA:3,1\nDA:4,0\nend_of_record' "$GITHUB_WORKSPACE" > shards/shard-2.lcov
          printf 'SF:%s/README.md\nDA:1,1\nDA:2,1\nDA:3,1\nDA:4,1\nend_of_record' "$GITHUB_WORKSPACE" > single.lcov

      - name: '1. Sharded, gate below the 75% union'
        id: s1
        uses: ./
        continue-on-error: true
        with:
          version: ${{ matrix.omni-dev }}
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/s1.lcov
          fail-under-lines: 70
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: integration.yml

      - name: '2. Sharded, gate above the 75% union'
        id: s2
        uses: ./
        continue-on-error: true
        with:
          version: ${{ matrix.omni-dev }}
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/s2.lcov
          fail-under-lines: 90
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: integration.yml

      - name: '3. Single report with the gate'
        id: s3
        uses: ./
        continue-on-error: true
        with:
          version: ${{ matrix.omni-dev }}
          run-coverage: false
          report: single.lcov
          fail-under-lines: 90
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: integration.yml

      - name: '4. A shard pattern that matches nothing'
        id: s4
        uses: ./
        continue-on-error: true
        with:
          version: ${{ matrix.omni-dev }}
          run-coverage: false
          shard-reports: shards/missing-*.lcov
          report: out/s4.lcov
          fail-under-lines: 70
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: integration.yml

      - name: Assert every outcome
        env:
          S1: ${{ steps.s1.outcome }}
          S2: ${{ steps.s2.outcome }}
          S3: ${{ steps.s3.outcome }}
          S4: ${{ steps.s4.outcome }}
          VERSION: ${{ steps.s1.outputs.version }}
        run: |
          status=0
          check() { # <label> <expected> <actual>
            if [ "$2" = "$3" ]; then
              echo "ok   - $1"
            else
              echo "::error::$1: expected $2, got $3"
              status=1
            fi
          }
          check "1. sharded, gate below the union" success "$S1"
          check "2. sharded, gate above the union" failure "$S2"
          check "3. single report with the gate" success "$S3"
          check "4. shard pattern matches nothing" failure "$S4"

          # Where the action stopped. 2 must fail at the gate, after the shards
          # were combined; 4 must fail before any report is written.
          if [ ! -s out/s2.lcov ]; then
            echo "::error::2 failed before the shards were combined, not at the gate"
            status=1
          fi
          if [ -e out/s4.lcov ]; then
            echo "::error::4 wrote a report although its pattern matches no shard"
            status=1
          fi

          # On a pull request 1 to 3 render the diff twice, for the comment and for
          # the percentages, and the failure-messages job reads this job's log for
          # a deprecation warning from either. The files show the steps ran: a
          # skipped step logs nothing, so a log without a warning proves nothing
          # about a step that did not run. The three scenarios share a workspace and
          # the files keep their names, so they show that at least one of them got
          # there; the diffs are called with the same flags in each, so one is enough
          # to show a deprecated flag.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if [ ! -s coverage.md ] || ! jq -e 'type == "object"' coverage.json > /dev/null 2>&1; then
              echo "::error::the pull-request diffs did not both run (coverage.md, coverage.json), so this job's log says nothing about deprecated flags"
              status=1
            fi
          fi

          # The binary on PATH is the version that was resolved. A cache entry
          # holding another version's binary fails here.
          bash tests/assert-omni-dev-version.sh "$VERSION" || status=1
          exit "$status"

  thin-mode-old-omni-dev:
    name: Thin mode (omni-dev without --fail-under-lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write fixtures
        run: |
          mkdir shards out
          printf 'SF:%s/README.md\nDA:1,1\nDA:2,0\nDA:3,1\nDA:4,0\nend_of_record' "$GITHUB_WORKSPACE" > shards/shard-1.lcov
          printf 'SF:%s/README.md\nDA:1,0\nDA:2,1\nDA:3,1\nDA:4,0\nend_of_record' "$GITHUB_WORKSPACE" > shards/shard-2.lcov

      # Sharded on purpose: the guard runs before "Combine shard reports", so a
      # missing combined report shows the guard stopped the action, not clap's
      # unknown-argument error at gate time (which comes after the combine).
      - name: '5a. Gate with an omni-dev that predates the flag'
        id: gate
        uses: ./
        continue-on-error: true
        with:
          version: ${{ env.OLD_OMNI_DEV }}
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/gate.lcov
          fail-under-lines: 70
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: integration.yml

      # The escape hatch the guard's own message recommends.
      - name: '5b. Same omni-dev, line gate disabled'
        id: nogate
        uses: ./
        continue-on-error: true
        with:
          version: ${{ env.OLD_OMNI_DEV }}
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/nogate.lcov
          fail-under-lines: ''
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: integration.yml

      - name: Assert every outcome
        env:
          GATE: ${{ steps.gate.outcome }}
          NOGATE: ${{ steps.nogate.outcome }}
        run: |
          status=0
          check() { # <label> <expected> <actual>
            if [ "$2" = "$3" ]; then
              echo "ok   - $1"
            else
              echo "::error::$1: expected $2, got $3"
              status=1
            fi
          }
          check "5a. gate with an omni-dev that predates the flag" failure "$GATE"
          check "5b. same omni-dev, line gate disabled" success "$NOGATE"

          if [ -e out/gate.lcov ]; then
            echo "::error::5a got past the guard: the shards were combined"
            status=1
          fi
          if [ ! -s out/nogate.lcov ]; then
            echo "::error::5b did not combine the shards"
            status=1
          fi

          # 5b is the one scenario here that gets past the guard, so on a pull
          # request it renders the diffs. See the thin-mode job for why the files.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if [ ! -s coverage.md ] || ! jq -e 'type == "object"' coverage.json > /dev/null 2>&1; then
              echo "::error::the pull-request diffs did not both run (coverage.md, coverage.json), so this job's log says nothing about deprecated flags"
              status=1
            fi
          fi

          bash tests/assert-omni-dev-version.sh "$OLD_OMNI_DEV" || status=1
          exit "$status"

  # An ARM64 Linux runner on an omni-dev release with no ARM64 asset (#19). The
  # action used to map every Linux runner to the x86_64 build, so this run would
  # have downloaded a binary it cannot execute and failed later, at the version
  # check, and never said why. It must now stop at the install step and name the
  # asset it looked for. The control is 5b: the same action inputs on an x86_64
  # runner, which must succeed. The install that succeeds on ARM64 needs a release that
  # carries the asset, which does not exist yet (#20).
  arm64-release-without-asset:
    name: Pre-built binary (ARM64 Linux, omni-dev without the ARM64 asset)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Write fixtures
        run: |
          mkdir shards out
          printf 'SF:%s/README.md\nDA:1,1\nDA:2,0\nDA:3,1\nDA:4,0\nend_of_record' "$GITHUB_WORKSPACE" > shards/shard-1.lcov
          printf 'SF:%s/README.md\nDA:1,0\nDA:2,1\nDA:3,1\nDA:4,0\nend_of_record' "$GITHUB_WORKSPACE" > shards/shard-2.lcov

      # 5b's action inputs, so the runner's architecture is what differs. The shards
      # are combined after the install, so a missing combined report shows where it
      # stopped.
      - name: '6. Pre-built omni-dev that has no ARM64 asset'
        id: install
        uses: ./
        continue-on-error: true
        with:
          version: ${{ env.OLD_OMNI_DEV }}
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/arm64.lcov
          fail-under-lines: ''
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: integration.yml

      - name: Assert the outcome
        env:
          INSTALL: ${{ steps.install.outcome }}
          ARCH: ${{ runner.arch }}
        run: |
          status=0
          # The scenario is only about an ARM64 runner if this is one.
          if [ "$ARCH" != ARM64 ] || [ "$(uname -m)" != aarch64 ]; then
            echo "::error::6 did not run on ARM64 Linux (runner.arch $ARCH, uname -m $(uname -m))"
            status=1
          fi

          if [ "$INSTALL" = failure ]; then
            echo "ok   - 6. pre-built omni-dev that has no ARM64 asset"
          else
            echo "::error::6. pre-built omni-dev that has no ARM64 asset: expected failure, got $INSTALL"
            status=1
          fi

          # It stopped at the install, not later.
          if [ -e out/arm64.lcov ]; then
            echo "::error::6 got past the install: the shards were combined"
            status=1
          fi

          # No binary was installed, least of all the x86_64 one that the old
          # mapping would have put here.
          if [ -e "$HOME/.cargo/bin/omni-dev" ]; then
            echo "::error::6 left an omni-dev behind at $HOME/.cargo/bin/omni-dev"
            status=1
          fi
          exit "$status"

  # The pull-request half of the guard. The comment diff and the patch gate pass
  # `-o/--output` (omni-dev 0.32.0), and they run only on a `pull_request` event, so
  # the guard fires only there. This job runs on EVERY event and what it expects
  # depends on the event: an omni-dev without the flag must be stopped on a pull
  # request and left alone everywhere else (a fat-mode push calls no `omni-dev
  # coverage` at all, so an old pin works there today). The other-event expectations
  # first run on the push after a merge, as `pr-paths.yml` says of the baseline hit.
  #
  # Thin mode with the line gate off, so nothing but the `--output` need is in play,
  # and no cargo build. Two legs lack the flag in different ways: 0.31.0 has `coverage
  # diff` without it, and 0.28.0 has no `coverage diff` to ask, so the guard's `--help`
  # fails. Both must reach the same message.
  output-flag:
    name: Output flag (omni-dev ${{ matrix.omni-dev }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The newest release with no `coverage` subcommand at all (it arrived in
          # 0.29.0), so `coverage diff --help` itself fails rather than lacking a flag.
          - omni-dev: '0.28.0'
            has-output: false
          # The newest release with `coverage diff` but without `--output`.
          - omni-dev: '0.31.0'
            has-output: false
          # The first release with it: the floor the README documents. It differs
          # from each leg above in nothing but `version`, so it is their control on a
          # pull request, and it pins the floor exactly.
          - omni-dev: '0.32.0'
            has-output: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write fixtures
        run: |
          mkdir shards out
          printf 'SF:%s/README.md\nDA:1,1\nDA:2,0\nDA:3,1\nDA:4,0\nend_of_record' "$GITHUB_WORKSPACE" > shards/shard-1.lcov
          printf 'SF:%s/README.md\nDA:1,0\nDA:2,1\nDA:3,1\nDA:4,0\nend_of_record' "$GITHUB_WORKSPACE" > shards/shard-2.lcov

      # Sharded on purpose: the guard runs before "Combine shard reports", so a
      # missing combined report shows the guard stopped the action. clap's error
      # from the comment step comes after the combine, and its redirect into
      # `coverage.md` would leave an empty file.
      - name: '7. Pull-request path with this omni-dev'
        id: pr
        uses: ./
        continue-on-error: true
        with:
          version: ${{ matrix.omni-dev }}
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/pr.lcov
          fail-under-lines: ''
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: integration.yml

      - name: Assert the outcome
        env:
          PR: ${{ steps.pr.outcome }}
          HAS_OUTPUT: ${{ matrix.has-output }}
          # The pin, not the action's `version` output: a failed composite step
          # may expose no outputs, and this leg is expected to fail.
          VERSION: ${{ matrix.omni-dev }}
        run: |
          status=0
          check() { # <label> <expected> <actual>
            if [ "$2" = "$3" ]; then
              echo "ok   - $1"
            else
              echo "::error::$1: expected $2, got $3"
              status=1
            fi
          }
          assert() { # <label> <command...>
            local label="$1"
            shift
            if "$@" > /dev/null 2>&1; then
              echo "ok   - $label"
            else
              echo "::error::$label"
              status=1
            fi
          }

          expect=success
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$HAS_OUTPUT" = false ]; then
            expect=failure
          fi
          check "7. pull-request path, omni-dev with --output: $HAS_OUTPUT, on $GITHUB_EVENT_NAME" "$expect" "$PR"

          if [ "$expect" = failure ]; then
            # Stopped at the guard: before the shards were combined, and before the
            # comment step could create its output.
            assert "7: stopped at the guard: no report written" test ! -e out/pr.lcov
            assert "7: stopped at the guard: no comment written" test ! -e coverage.md
          else
            assert "7: got past the guard: the shards were combined" test -s out/pr.lcov
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              # Both `-o` call sites the step reaches ran: markdown and json.
              assert "7: the comment was rendered with -o markdown" test -s coverage.md
              assert "7: the percentages were rendered with -o json" jq -e 'type == "object"' coverage.json
            else
              assert "7: no diff rendered outside a pull request" test ! -e coverage.md
            fi
          fi

          bash tests/assert-omni-dev-version.sh "$VERSION" || status=1
          exit "$status"

  # `ignore-filename-regex` reaching the diff (#3). The thin-mode line gate is the one
  # `coverage diff` the action runs on every event, so it is where the filter shows on a
  # push too. The report is README.md fully covered and LICENSE not at all: 50% (4 of 8
  # lines), and 100% once LICENSE is filtered out. 8a and 8b differ only in the filter, so
  # a gate of 70 passes with it and fails without it. 8a's value holds two patterns, the
  # first matching nothing, and an anchor: it filters LICENSE only if the value is split at
  # the comma and matched against the repo-relative path. The comment diff and the patch
  # gate take the same filter; pr-paths.yml shows that (P5, P6) where the patch is known.
  ignore-filename-regex:
    name: Ignore filename regex (omni-dev ${{ matrix.omni-dev }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 0.45.0 is the floor of the thin-mode line gate this uses; `latest` catches a
        # bad future release.
        omni-dev: ['0.45.0', 'latest']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Sharded, so that a combined report shows where 8b stopped: the combine comes
      # after the guard and before the gate.
      - name: Write fixtures
        run: |
          mkdir shards out
          printf 'SF:%s/README.md\nDA:1,1\nDA:2,1\nDA:3,1\nDA:4,1\nend_of_record' "$GITHUB_WORKSPACE" > shards/shard-1.lcov
          printf 'SF:%s/LICENSE\nDA:1,0\nDA:2,0\nDA:3,0\nDA:4,0\nend_of_record' "$GITHUB_WORKSPACE" > shards/shard-2.lcov

      - name: '8a. Line gate with LICENSE filtered out'
        id: filtered
        uses: ./
        continue-on-error: true
        with:
          version: ${{ matrix.omni-dev }}
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/filtered.lcov
          fail-under-lines: 70
          ignore-filename-regex: 'nomatch\.txt,^LICENSE$'
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: integration.yml

      # Control for 8a: only the filter differs.
      - name: '8b. The same line gate without the filter'
        id: unfiltered
        uses: ./
        continue-on-error: true
        with:
          version: ${{ matrix.omni-dev }}
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/unfiltered.lcov
          fail-under-lines: 70
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: integration.yml

      - name: Assert every outcome
        env:
          FILTERED: ${{ steps.filtered.outcome }}
          UNFILTERED: ${{ steps.unfiltered.outcome }}
          VERSION: ${{ steps.filtered.outputs.version }}
        run: |
          status=0
          check() { # <label> <expected> <actual>
            if [ "$2" = "$3" ]; then
              echo "ok   - $1"
            else
              echo "::error::$1: expected $2, got $3"
              status=1
            fi
          }
          check "8a. line gate with LICENSE filtered out" success "$FILTERED"
          check "8b. the same line gate without the filter" failure "$UNFILTERED"

          # 8b must fail at the gate, after the shards were combined.
          if [ ! -s out/unfiltered.lcov ]; then
            echo "::error::8b failed before the shards were combined, not at the gate"
            status=1
          fi

          # On a pull request both scenarios render the diffs, with the filter in 8a, and
          # the failure-messages job reads this job's log for a deprecation warning from
          # either. The files show the steps ran: a skipped step logs nothing, so a log
          # without a warning proves nothing about a step that did not run.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if [ ! -s coverage.md ] || ! jq -e 'type == "object"' coverage.json > /dev/null 2>&1; then
              echo "::error::the pull-request diffs did not both run (coverage.md, coverage.json), so this job's log says nothing about deprecated flags"
              status=1
            fi
          fi

          # The binary on PATH is the version that was resolved. A cache entry
          # holding another version's binary fails here.
          if ! omni-dev --version | grep -qF "$VERSION"; then
            echo "::error::omni-dev on PATH is not $VERSION ($(omni-dev --version)); a poisoned cache?"
            status=1
          fi
          exit "$status"

  # The guard for `--ignore-filename-regex` (#3), shaped like `output-flag`: the flag is
  # passed wherever a diff runs, so with the line gate off the guard fires only on a
  # `pull_request`, and this job runs on EVERY event and expects by event. An omni-dev
  # without the flag must be stopped on a pull request and left alone everywhere else (a
  # fat-mode push calls no `omni-dev coverage` at all). The other-event expectations first
  # run on the push after a merge. 0.32.0 is the newest release without the flag and has
  # `--output`, so on a pull request this flag is the guard's only complaint.
  ignore-filename-regex-flag:
    name: Ignore filename regex flag (omni-dev ${{ matrix.omni-dev }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The newest release without `--ignore-filename-regex`.
          - omni-dev: '0.32.0'
            has-flag: false
          # The first release with it: the floor the README documents. It differs from
          # the leg above in nothing but `version`, so it is that leg's control on a pull
          # request, and it pins the floor exactly.
          - omni-dev: '0.33.0'
            has-flag: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write fixtures
        run: |
          mkdir shards out
          printf 'SF:%s/README.md\nDA:1,1\nDA:2,0\nDA:3,1\nDA:4,0\nend_of_record' "$GITHUB_WORKSPACE" > shards/shard-1.lcov
          printf 'SF:%s/README.md\nDA:1,0\nDA:2,1\nDA:3,1\nDA:4,0\nend_of_record' "$GITHUB_WORKSPACE" > shards/shard-2.lcov

      # Sharded on purpose, as in `output-flag`: the guard runs before "Combine shard
      # reports", so a missing combined report shows the guard stopped the action.
      - name: '9. The filter set, with this omni-dev'
        id: filter
        uses: ./
        continue-on-error: true
        with:
          version: ${{ matrix.omni-dev }}
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/filter.lcov
          fail-under-lines: ''
          ignore-filename-regex: 'LICENSE'
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: integration.yml

      - name: Assert the outcome
        env:
          FILTER: ${{ steps.filter.outcome }}
          HAS_FLAG: ${{ matrix.has-flag }}
          # The pin, not the action's `version` output: a failed composite step
          # may expose no outputs, and this leg is expected to fail.
          VERSION: ${{ matrix.omni-dev }}
        run: |
          status=0
          check() { # <label> <expected> <actual>
            if [ "$2" = "$3" ]; then
              echo "ok   - $1"
            else
              echo "::error::$1: expected $2, got $3"
              status=1
            fi
          }
          assert() { # <label> <command...>
            local label="$1"
            shift
            if "$@" > /dev/null 2>&1; then
              echo "ok   - $label"
            else
              echo "::error::$label"
              status=1
            fi
          }

          expect=success
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$HAS_FLAG" = false ]; then
            expect=failure
          fi
          check "9. the filter set, omni-dev with --ignore-filename-regex: $HAS_FLAG, on $GITHUB_EVENT_NAME" "$expect" "$FILTER"

          if [ "$expect" = failure ]; then
            # Stopped at the guard: before the shards were combined, and before the
            # comment step could create its output.
            assert "9: stopped at the guard: no report written" test ! -e out/filter.lcov
            assert "9: stopped at the guard: no comment written" test ! -e coverage.md
          else
            assert "9: got past the guard: the shards were combined" test -s out/filter.lcov
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              # Both call sites the step reaches ran with the flag, on this omni-dev:
              # markdown and json.
              assert "9: the comment was rendered with the filter" test -s coverage.md
              assert "9: the percentages were rendered with the filter" jq -e 'type == "object"' coverage.json
            else
              assert "9: no diff rendered outside a pull request" test ! -e coverage.md
            fi
          fi

          if ! omni-dev --version | grep -qF "$VERSION"; then
            echo "::error::omni-dev on PATH is not $VERSION ($(omni-dev --version)); a poisoned cache?"
            status=1
          fi
          exit "$status"

  fat-mode:
    name: Fat mode (fixture crate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The action runs cargo at the workspace root, and a caller cannot give a
      # composite action's steps a working directory, so the committed fixture
      # crate is copied there. Only this job's checkout gets a root Cargo.toml.
      # The crate has no dependencies, so there is no lockfile to commit.
      - name: Copy the fixture crate to the workspace root
        run: |
          if [ -e Cargo.toml ] || [ -e src ]; then
            echo "::error::Cargo.toml or src/ already exists at the repository root; the fixture would overwrite it"
            exit 1
          fi
          cp -R tests/fixtures/fat-crate/. .
          mkdir out

      # The full configuration. The fixture covers 14 of 24 lines (58.3%) with
      # everything, and 8 of 24 (33.3%) without the extra command, so the gates of
      # 40 and 80 sit well either side of it. `setup-ran.txt` is what the main
      # test needs, so it fails unless setup ran first. The setup test runs with
      # profiling off, so `setup_only` must stay uncovered; the extra test is
      # profiled, so `extra_only` must be covered. `recompute-baseline` is off
      # because the fixture is not in git history, so the merge-base worktree
      # that a pull request would build has no Cargo.toml.
      - name: 'F1. Full configuration, gate below the fixture coverage'
        id: f1
        uses: ./
        continue-on-error: true
        with:
          report: out/f1.lcov
          fail-under-lines: 40
          setup-commands: |
            echo ready > setup-ran.txt
            cargo test -- --ignored --exact tests::setup_only_works
          extra-test-commands: cargo test -- --ignored --exact tests::extra_only_works
          comment: false
          upload-artifacts: false
          publish-baseline: false
          recompute-baseline: false
          baseline-workflow: integration.yml

      - name: Move F1 outputs aside
        if: always()
        run: bash tests/move-outputs.sh f1

      # Control for F1: only the gate differs.
      - name: 'F2. Same, gate above the fixture coverage'
        id: f2
        uses: ./
        continue-on-error: true
        with:
          report: out/f2.lcov
          fail-under-lines: 80
          setup-commands: |
            echo ready > setup-ran.txt
            cargo test -- --ignored --exact tests::setup_only_works
          extra-test-commands: cargo test -- --ignored --exact tests::extra_only_works
          comment: false
          upload-artifacts: false
          publish-baseline: false
          recompute-baseline: false
          baseline-workflow: integration.yml

      - name: Move F2 outputs aside
        if: always()
        run: bash tests/move-outputs.sh f2

      # Control for F1: no extra command, so `extra_only` must now be uncovered.
      # The gate is off because 33.3% is under 40.
      - name: 'F3. Without extra-test-commands'
        id: f3
        uses: ./
        continue-on-error: true
        with:
          report: out/f3.lcov
          fail-under-lines: ''
          setup-commands: |
            echo ready > setup-ran.txt
            cargo test -- --ignored --exact tests::setup_only_works
          comment: false
          upload-artifacts: false
          publish-baseline: false
          recompute-baseline: false
          baseline-workflow: integration.yml

      - name: Move F3 outputs aside
        if: always()
        run: bash tests/move-outputs.sh f3

      # Control for F1: no setup command, so the main test fails and the action
      # stops before it writes any report.
      - name: 'F4. Without setup-commands'
        id: f4
        uses: ./
        continue-on-error: true
        with:
          report: out/f4.lcov
          fail-under-lines: 40
          extra-test-commands: cargo test -- --ignored --exact tests::extra_only_works
          comment: false
          upload-artifacts: false
          publish-baseline: false
          recompute-baseline: false
          baseline-workflow: integration.yml

      - name: Move F4 outputs aside
        if: always()
        run: bash tests/move-outputs.sh f4

      - name: Assert every outcome
        env:
          F1: ${{ steps.f1.outcome }}
          F2: ${{ steps.f2.outcome }}
          F3: ${{ steps.f3.outcome }}
          F4: ${{ steps.f4.outcome }}
          VERSION: ${{ steps.f1.outputs.version }}
        run: |
          status=0
          check() { # <label> <expected> <actual>
            if [ "$2" = "$3" ]; then
              echo "ok   - $1"
            else
              echo "::error::$1: expected $2, got $3"
              status=1
            fi
          }
          assert() { # <label> <command...>
            local label="$1"
            shift
            if "$@" > /dev/null 2>&1; then
              echo "ok   - $label"
            else
              echo "::error::$label"
              status=1
            fi
          }
          # Whether a function's declaration line is covered in an lcov report:
          # covered, uncovered, or missing (no record for it). The line comes from
          # the fixture because the FN records carry hash-suffixed mangled names.
          state() { # <lcov> <function>
            local line
            line="$(grep -n "pub fn $2(" src/lib.rs | head -1 | cut -d: -f1)"
            awk -F'[:,]' -v line="$line" '
              $1 == "DA" && $2 == line { print ($3 > 0 ? "covered" : "uncovered"); found = 1 }
              END { if (!found) print "missing" }' "$1"
          }

          check "F1. full configuration, gate below the coverage" success "$F1"
          check "F2. same, gate above the coverage" failure "$F2"
          check "F3. without extra-test-commands" success "$F3"
          check "F4. without setup-commands" failure "$F4"

          # F1: the three outputs exist and are well formed.
          assert "F1: codecov.json names src/lib.rs" \
            jq -e '.coverage | keys | any(endswith("/src/lib.rs"))' out/f1/codecov.json
          assert "F1: the lcov report has a record for src/lib.rs" \
            grep -q '^SF:.*/src/lib\.rs$' out/f1.lcov
          assert "F1: the summary has a TOTAL row" \
            grep -q '^TOTAL' out/f1/coverage-summary.txt

          # F1: which part of the run reached which function.
          check "F1: main_run, from the main test run" covered "$(state out/f1.lcov main_run)"
          check "F1: extra_only, from extra-test-commands" covered "$(state out/f1.lcov extra_only)"
          check "F1: setup_only, run with profiling off" uncovered "$(state out/f1.lcov setup_only)"
          check "F1: never, reached by nothing" uncovered "$(state out/f1.lcov never)"
          # Without this, setup_only could be uncovered only because its test
          # never ran.
          assert "F1: the setup test ran" test -e out/f1/setup-test-ran.txt
          assert "F1: the main test ran" test -e out/f1/main-test-ran.txt

          # F2 must fail at the gate, after every output was written.
          assert "F2: stopped at the gate: codecov.json written" test -s out/f2/codecov.json
          assert "F2: stopped at the gate: lcov written" test -s out/f2.lcov
          assert "F2: stopped at the gate: summary written" test -s out/f2/coverage-summary.txt

          # F3 differs from F1 only in the extra command.
          check "F3: main_run still covered" covered "$(state out/f3.lcov main_run)"
          check "F3: extra_only uncovered without the extra command" uncovered "$(state out/f3.lcov extra_only)"

          # F4 must fail in the main test run, before any report. The test leaves
          # a marker before it checks for the setup's file, so the marker shows
          # the failure came from the test and not from an earlier step.
          assert "F4: stopped in the main test: it ran" test -e out/f4/main-test-ran.txt
          assert "F4: stopped in the main test: no lcov" test ! -e out/f4.lcov
          assert "F4: stopped in the main test: no codecov.json" test ! -e out/f4/codecov.json

          # The comment is built on pull requests only. Its total is the report's
          # own total, so it shows the diff was rendered from F1's report.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            total="$(awk '/^TOTAL/ { print $10 }' out/f1/coverage-summary.txt)"
            assert "F1: the pull-request comment reports the run's total ($total)" \
              grep -qF "Total: **$total**" out/f1/coverage.md
            # The other diff, which the failure-messages job reads this job's log
            # for a deprecation warning from. The comment's file shows the first ran.
            assert "F1: the percentages were rendered with -o json" \
              jq -e 'type == "object"' out/f1/coverage.json
          else
            assert "F1: no diff rendered outside a pull request" test ! -e out/f1/coverage.md
          fi

          # The binary on PATH is the version that was resolved. A cache entry
          # holding another version's binary fails here.
          bash tests/assert-omni-dev-version.sh "$VERSION" || status=1
          exit "$status"

  # The control for the deprecation check in `failure-messages` (#23). No other job
  # should log an omni-dev deprecation warning, and a reader that cannot see one
  # reports the same empty result. This job logs one on purpose: it calls omni-dev
  # directly with the flag the action no longer passes, and the action is here only
  # to install omni-dev (it passes `-o`). It differs from a scenario in that call and
  # nothing else.
  # `latest`, so that if omni-dev rewords the warning or removes the flag, this is
  # where it shows, and the message there says what to do. `|| rc=$?` because a
  # removed flag is an error, and what to say about it is the reader's, below.
  deprecation-control:
    name: Deprecation warning (control)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write fixtures
        run: printf 'SF:%s/README.md\nDA:1,1\nDA:2,0\nend_of_record' "$GITHUB_WORKSPACE" > single.lcov

      - name: 'D1. Install omni-dev through the action'
        uses: ./
        with:
          version: latest
          run-coverage: false
          report: single.lcov
          fail-under-lines: ''
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: integration.yml

      - name: 'D2. Pass the deprecated flag to omni-dev directly'
        run: |
          rc=0
          omni-dev coverage diff --report single.lcov --base-ref HEAD --format json > /dev/null || rc=$?
          echo "omni-dev exited $rc"

  # Five of the scenarios above exist mainly for their message, which is what a
  # user reads: a shard pattern that matches nothing must name the pattern, a
  # guard that finds no `--fail-under-lines`, `--output` or `--ignore-filename-regex`
  # must say how to fix it, and a release with no asset for the runner's
  # architecture must name the asset. A step cannot read its own job's log and a composite action's failing
  # step exposes no output, so the outcome and file checks above pin the step
  # order, not the text. This job reads the finished jobs' logs instead. It reads
  # them for a second thing: on a pull request, the jobs that ran the diffs must
  # not have logged an omni-dev deprecation warning, and the control job must have.
  failure-messages:
    name: Failure messages
    # Skipped when a scenario job is red: the run is red already, and a scenario
    # that did not run as intended would only add "message missing" errors that
    # bury the cause.
    needs:
      - thin-mode
      - thin-mode-old-omni-dev
      - arm64-release-without-asset
      - output-flag
      - ignore-filename-regex
      - ignore-filename-regex-flag
      - fat-mode
      - deprecation-control
    runs-on: ubuntu-latest
    # The only job here with `actions: read`, which reading a job's log needs.
    # `contents: read` is the checkout: a job-level `permissions` drops the rest.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Assert the failure messages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          # expect <label> <error messages> <fragment>...: passes when ONE message
          # holds every fragment (each fragment narrows the lines to those that
          # contain it), so two different errors cannot add up to a pass. Fragments
          # are fixed strings.
          expect() {
            local label=$1 errors=$2 matching=$2 line fragment
            shift 2
            for fragment in "$@"; do
              matching="$(grep -F -- "$fragment" <<<"$matching" || true)"
            done
            if [ -n "$matching" ]; then
              echo "ok   - $label"
              return 0
            fi
            echo "::error::$label: no single error message holds all of:$(printf " '%s'" "$@")"
            echo "the job logged:"
            if [ -n "$errors" ]; then
              while IFS= read -r line; do echo "  $line"; done <<<"$errors"
            else
              echo "  (no error lines)"
            fi
            status=1
          }

          # 4: a shard pattern that matches nothing names the pattern. Both legs of
          # the thin-mode matrix run it; keep the versions in step with that matrix.
          # The pattern is the one in scenario 4's `shard-reports`.
          for version in 0.45.0 latest; do
            if errors="$(bash tests/job-errors.sh "Thin mode (omni-dev $version)")"; then
              expect "4 (omni-dev $version): the pattern that matched nothing is named" "$errors" \
                "shard-reports pattern 'shards/missing-*.lcov' matched no files"
            else
              status=1
            fi
          done

          # 5a: the guard names the omni-dev it found and both ways out. The job
          # name is the one `thin-mode-old-omni-dev` sets above. Every check holds
          # the guard's own first words, so each is about its message and no other.
          guard="has no 'coverage diff --fail-under-lines'"
          if errors="$(bash tests/job-errors.sh 'Thin mode (omni-dev without --fail-under-lines)')"; then
            expect "5a: the guard names the omni-dev it found" "$errors" \
              "omni-dev $OLD_OMNI_DEV" "$guard"
            expect "5a: the guard says to set 'version' to a release with the flag" "$errors" \
              "$guard" "Set 'version' to a release that includes it"
            expect "5a: the guard says to set 'fail-under-lines' to an empty string" "$errors" \
              "$guard" "set 'fail-under-lines' to an empty string"
          else
            status=1
          fi

          # 6: a release with no asset for the runner's architecture names the release
          # and the asset it looked for, and gives both ways out. The job name is the
          # one `arm64-release-without-asset` sets above. Every check holds the asset's
          # own name, so a message about another file cannot satisfy it.
          asset="omni-dev-linux-arm64.tar.gz"
          if errors="$(bash tests/job-errors.sh 'Pre-built binary (ARM64 Linux, omni-dev without the ARM64 asset)')"; then
            expect "6: the release and the missing asset are named" "$errors" \
              "omni-dev v$OLD_OMNI_DEV has no pre-built $asset" "Linux ARM64"
            expect "6: the message says to set 'version' to a release that has the asset" "$errors" \
              "$asset" "Set 'version' to a release that has it"
            expect "6: the message says to build from source" "$errors" \
              "$asset" "set 'use-prebuilt-binary: false' to build from source"
          else
            status=1
          fi

          # 7: on a pull request the `--output` guard names the omni-dev it found, the
          # floor and the way out. Only a pull request runs it, so on any other event
          # the legs without the flag succeed and have no message to read. Both legs
          # without it must reach the same message: 0.31.0 has `coverage diff` without
          # the flag, and 0.28.0 has no `coverage diff` at all, so its `--help` fails
          # before anything is read. The job names are the ones `output-flag` sets
          # above; keep the versions in step with its matrix. The version is a fragment
          # of its own because `omni-dev --version` can carry a commit and date after it.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            guard="has no 'coverage diff --output'"
            for version in 0.28.0 0.31.0; do
              if errors="$(bash tests/job-errors.sh "Output flag (omni-dev $version)")"; then
                expect "7 (omni-dev $version): the guard names the omni-dev it found" "$errors" \
                  "omni-dev $version" "$guard"
                expect "7 (omni-dev $version): the guard names the 0.32.0 floor" "$errors" \
                  "$guard" "It needs omni-dev 0.32.0 or later"
                expect "7 (omni-dev $version): the guard says to set 'version' to the floor or 'latest'" "$errors" \
                  "$guard" "set 'version' to 0.32.0 or later, or to 'latest'"
              else
                status=1
              fi
            done
          fi

          # 9: on a pull request the `--ignore-filename-regex` guard names the omni-dev it
          # found, the floor and both ways out. Only a pull request runs it in the job
          # below (the line gate is off), so on any other event the leg without the flag
          # succeeds and has no message to read. The job name is the one
          # `ignore-filename-regex-flag` sets above; keep the version in step with its matrix.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            guard="has no 'coverage diff --ignore-filename-regex'"
            if errors="$(bash tests/job-errors.sh 'Ignore filename regex flag (omni-dev 0.32.0)')"; then
              expect "9: the guard names the omni-dev it found" "$errors" \
                "omni-dev 0.32.0" "$guard"
              expect "9: the guard names the 0.33.0 floor" "$errors" \
                "$guard" "It needs omni-dev 0.33.0 or later"
              expect "9: the guard says to set 'version' to the floor or 'latest'" "$errors" \
                "$guard" "set 'version' to 0.33.0 or later, or to 'latest'"
              expect "9: the guard says to set 'ignore-filename-regex' to an empty string" "$errors" \
                "$guard" "set 'ignore-filename-regex' to an empty string"
            else
              status=1
            fi
          fi
          exit "$status"

      # What omni-dev says about a flag the action passes, read from the same logs.
      # The control runs on every event; the absence checks on a pull request only,
      # because the diffs they are about run on a pull request alone. The jobs that
      # run them show with a file check, in their own assertion steps, that they did.
      # A separate check of the same logs, so it runs when the messages above fail too.
      - name: Assert the deprecation warnings
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0

          # The control passes the deprecated flag on purpose, so its log holds the
          # warning. Finding none means the reader cannot see a warning, or omni-dev
          # no longer prints this one, and then every check below would pass for
          # nothing. The warning is matched on the flag and what to use instead, not
          # on its wording, so a reworded message that still names both passes.
          control='Deprecation warning (control)'
          if lines="$(bash tests/job-deprecations.sh "$control")"; then
            matching="$(grep -F -- '--format' <<<"$lines" || true)"
            if grep -qF -- '-o/--output' <<<"$matching"; then
              echo "ok   - control: the warning for the flag it passes on purpose is found"
            else
              echo "::error::control: no deprecation warning names '--format' and '-o/--output' in '$control'. If omni-dev reworded it, update tests/job-deprecations.sh; if it removed the flag, retire this control."
              echo "the job logged:"
              if [ -n "$lines" ]; then
                while IFS= read -r line; do echo "  $line"; done <<<"$lines"
              else
                echo "  (no deprecation lines)"
              fi
              status=1
            fi
          else
            status=1
          fi

          # Every other job of the run that finished green, found through the API, so
          # a new job or matrix leg is read without being added to a list. This job
          # is still running, so it is not among them, and the control is read above.
          # A job that stops at a guard (output-flag 0.31.0, the ARM64 job) logs none,
          # which is the right answer for it. The jobs that run the diffs show with a
          # file check, in their own assertion steps, that they did.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            jobs="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=latest&per_page=100")"
            names="$(jq -s -r --arg control "$control" \
              '.[].jobs[] | select(.conclusion == "success" and .name != $control) | .name' <<<"$jobs")"
            if [ -z "$names" ]; then
              echo "::error::the run has no finished job to read the log of, so nothing was checked"
              status=1
            fi
            while IFS= read -r job; do
              [ -n "$job" ] || continue
              if lines="$(bash tests/job-deprecations.sh "$job" </dev/null)"; then
                if [ -z "$lines" ]; then
                  echo "ok   - $job: no deprecation warning"
                else
                  echo "::error::$job logged a deprecation warning. If omni-dev printed it, action.yml passes a flag omni-dev has deprecated: stop passing it and add it to tests/check-deprecated-flags.sh. If another tool did, see what it deprecated."
                  while IFS= read -r line; do echo "  $line"; done <<<"$lines"
                  status=1
                fi
              else
                status=1
              fi
            done <<<"$names"
          fi
          exit "$status"
