# Keeps the pinned actions current (#58): the workflows in .github/workflows/ and the
# composite action's own steps in action.yml, which `directory: /` reads (Dependabot's
# github_actions file fetcher takes the root action.yml and .github/workflows/*.yml).
#
# Its commit messages must pass the required `Validate Commit Messages`, and one cannot be
# amended after the fact. The default scope, `deps`, is not one of this project's
# (.omni-dev/scopes.yaml), so the prefix is set: `ci(ci): bump <action> from <a> to <b>`.
# Do not add `commit-message.include: scope`: Dependabot would write `ci(ci)(deps): ...`, which
# the lint rejects. tests/dependabot-config.test.sh holds every entry to the project's scopes
# and types, to no `include:` and to the subject length, since a prefix that fails the lint
# would fail every pull request the bot opens.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Two pins were behind when this was written (actions/checkout and actions/cache), so
    # the first run opens two pull requests; more would wait for those.
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci(ci)"
